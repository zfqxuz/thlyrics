body.ui-ios .lblock .zh{font-size:12.5px;color:var(--ink-3);border-left:0;padding-left:0;margin-top:6px}
body.ui-ios .legend{font-family:var(--sans);font-size:11px;color:var(--ink-3);gap:12px}
body.ui-ios #plyric.has-active .lblock{opacity:.22}
body.ui-ios #plyric.has-active .lblock.playing{opacity:1;background:transparent}
body.ui-ios #plyric.has-active .lblock.playing::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:2px;background:var(--accent);
}

/* 迷你播放条：薄玻璃，播放键不铺色 */
body.ui-ios #minibar{bottom:calc(var(--ios-tabbar-h) + 18px + env(safe-area-inset-bottom,0px));padding:0 12px}
body.ui-ios #minibar .inner{
  max-width:620px;padding:7px 10px;border-radius:17px;
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:0 16px 40px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios #minibar .mbprog{display:none}
body.ui-ios #minibar .t1{font-family:var(--sans);font-size:13px;font-weight:500}
body.ui-ios #minibar .t2{font-size:10.5px;color:var(--ink-3)}
body.ui-ios #playbtn{
  width:32px;height:32px;border-radius:50%;background:transparent;border:1px solid var(--line);
  color:var(--accent);font-size:13px;box-shadow:none;
}
body.ui-ios #playbtn:hover{background:var(--hov)}
body.ui-ios #minibar .nbtn{width:30px;height:30px;color:var(--ink-3)}
body.ui-ios #minibar .modechip{font-family:var(--sans);color:var(--accent);font-size:11.5px}

/* 全屏跟唱：内容干净，控制区是一层薄玻璃 */
body.ui-ios #player{background:var(--bg)}
body.ui-ios #player .phead{padding:calc(10px + env(safe-area-inset-top,0px)) 18px 6px}
body.ui-ios #player .phead .a{font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:-.01em}
body.ui-ios #player .phead .b{font-size:11px;color:var(--ink-3)}
body.ui-ios #player .phead .pcover{border-radius:8px;box-shadow:none}
body.ui-ios #player .round{width:34px;height:34px;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
body.ui-ios #player .plyrics{padding:14px 18px 24px}
body.ui-ios #player .pctl{
  padding:10px 18px calc(16px + env(safe-area-inset-bottom));
  background:var(--glass);border-top:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios #player .pctl::before{display:none}
body.ui-ios #player .tracknav{width:36px;height:36px;background:transparent;border:1px solid var(--line);color:var(--ink-2)}
body.ui-ios #player .navbtn{font-family:var(--sans);font-size:12.5px;font-weight:400;color:var(--ink-2);min-width:54px}
body.ui-ios #player .big{
  width:54px;height:54px;border-radius:50%;background:var(--glass);border:1px solid var(--glass-line);
  color:var(--accent);box-shadow:inset 0 1px 0 var(--glass-highlight),0 10px 28px rgba(0,0,0,.14);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
body.ui-ios #player .scope2{background:var(--field);padding:2px;border-radius:8px;border:1px solid var(--line)}
body.ui-ios #player .scope2 .half{height:26px;border-radius:6px;font-family:var(--sans);font-size:12px;padding:0 10px;color:var(--ink-3)}
body.ui-ios #player .scope2 .half + .half{border-left:0}
body.ui-ios #player .scope2 .half.on{background:var(--glass-strong);color:var(--ink);box-shadow:none}
body.ui-ios #player .scope2 .half.on::after{display:none}
body.ui-ios #player .chipcycle{font-family:var(--sans);font-size:12px;padding:0 7px;height:30px;border-radius:8px;color:var(--ink-3)}
body.ui-ios #player .chipcycle.on{background:transparent;color:var(--accent)}
body.ui-ios #player .chipcycle.on::after{display:none}
body.ui-ios #player .time{font-size:10.5px;color:var(--ink-3)}
body.ui-ios #player input[type=range]{accent-color:var(--accent)}
body.ui-ios #displaybox{
  border-radius:16px;border:1px solid var(--glass-line);
  background:var(--glass-strong);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-highlight);padding:6px 12px;
}
body.ui-ios #displaybox .dr{padding:9px 0;font-family:var(--sans);font-size:12.5px}
body.ui-ios #displaybox .dr button{font-family:var(--sans);font-size:12.5px;color:var(--ink-3);background:transparent}
body.ui-ios #displaybox .dr button.on{background:transparent;color:var(--accent);font-weight:500;padding:0}
body.ui-ios #displaybox .dr button.on::after{display:none}

/* 词条抽屉：真正像 iOS sheet */
body.ui-ios .sheet{
  border-radius:26px 26px 0 0;border:1px solid var(--glass-line);border-bottom:0;
  background:var(--glass-strong);
  -webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
  box-shadow:0 -24px 70px rgba(0,0,0,.28),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .sheet .grab{width:34px;height:4px;background:var(--grab);margin:9px auto 7px}
body.ui-ios .sheet .pop-body{padding:0 18px 8px}
body.ui-ios #pop .r1{padding-bottom:10px;border-bottom:1px solid var(--hairline)}
body.ui-ios #pop .w1{font-family:var(--sans);font-size:30px;font-weight:600;letter-spacing:-.03em}
body.ui-ios #pop .w2{font-family:var(--sans);font-size:14px;color:var(--ink-2);font-weight:400}
body.ui-ios #pop .w3{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
body.ui-ios #pop .mg{font-family:var(--sans);font-size:16px;line-height:1.55;font-weight:400}
body.ui-ios #pop .mt{font-size:11px;color:var(--ink-3)}
body.ui-ios #pop .icbtn{width:32px;height:32px;background:transparent;border:1px solid var(--line);color:var(--ink-3)}
body.ui-ios #pop .icbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
body.ui-ios #pop .icbtn.star.on{background:var(--star-soft);border-color:transparent;color:var(--star)}
body.ui-ios #pop input{height:36px;background:var(--field);border:1px solid var(--line);border-radius:9px;font-family:var(--sans);font-size:13px}
body.ui-ios #pop .pop-more{font-family:var(--sans);font-size:11px;color:var(--ink-3)}
body.ui-ios .pop-sec-t{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.04em;color:var(--ink-3)}
body.ui-ios .exrow{padding:9px 0;border-bottom:1px solid var(--hairline)}
body.ui-ios .exrow .exico{width:28px;height:28px;background:transparent;border:1px solid var(--line);color:var(--ink-3)}
body.ui-ios .exrow.on .exico{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* 弹窗 / 闸门：玻璃卡，按钮细线，不铺大色块 */
body.ui-ios #dlg{background:rgba(0,0,0,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
body.ui-ios .dlgcard{
  background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:22px;padding:20px;
  -webkit-backdrop-filter:blur(32px) saturate(180%);backdrop-filter:blur(32px) saturate(180%);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .dlgcard .dlgt{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:-.01em}
body.ui-ios .dlgcard .dlgb{font-size:13px;color:var(--ink-2);line-height:1.55}
body.ui-ios .dlgcard .dlga{gap:8px;margin-top:18px}
body.ui-ios .dlgcard .dlga button{
  height:38px;border-radius:19px;background:transparent;border:1px solid var(--line);
  color:var(--ink-2);font-family:var(--sans);font-size:13px;font-weight:400;
}
body.ui-ios .dlgcard .dlga .btn-main{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent);font-weight:500}
body.ui-ios .gatecard{
  background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:24px;
  -webkit-backdrop-filter:blur(34px) saturate(180%);backdrop-filter:blur(34px) saturate(180%);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .gatecard .gtitle{font-family:var(--sans);font-size:23px;font-weight:600;letter-spacing:-.03em}
body.ui-ios .gatecard .gsub{font-size:12.5px;color:var(--ink-3)}
body.ui-ios .gatecard .sel{background:var(--field);border:1px solid var(--line);border-radius:9px}
body.ui-ios .gcode{background:var(--field);border:1px solid var(--line);border-radius:10px}
body.ui-ios .pickitem{background:transparent;border:1px solid var(--line);border-radius:10px}
body.ui-ios .pickitem.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent)}

/* 复习：细线卡片 + 玻璃反馈 */
body.ui-ios .revwrap{max-width:540px}
body.ui-ios .revx{font-family:var(--sans);font-size:13px;color:var(--accent)}
body.ui-ios .revcount{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
body.ui-ios .revbar{height:2px;border-radius:999px;background:var(--track);margin-top:8px}
body.ui-ios .revbar i{border-radius:999px;background:var(--accent);opacity:.75}
body.ui-ios .revkind{font-family:var(--sans);font-size:10.5px;letter-spacing:.04em;color:var(--ink-3)}
body.ui-ios .revprompt .rw1{font-family:var(--sans);font-size:36px;font-weight:600;letter-spacing:-.03em}
body.ui-ios .revprompt .rw2,body.ui-ios .revprompt .rw3,body.ui-ios .revprompt .rw4{font-family:var(--sans)}
body.ui-ios .revprompt .rw4{font-size:18px;font-weight:500}
body.ui-ios .revopts{gap:8px}
body.ui-ios .revopt{
  min-height:50px;padding:12px 14px;border:1px solid var(--line);
  border-radius:12px;background:transparent;font-size:15px;box-shadow:none;
}
body.ui-ios .revopt .k{width:22px;height:22px;border-radius:50%;border-color:var(--line);background:transparent;color:var(--ink-3);font-size:10px}
body.ui-ios .revopt:hover{background:var(--hov);border-color:var(--ink-mute)}
body.ui-ios .revopt.right{border-color:var(--ok);background:var(--ok-soft)}
body.ui-ios .revopt.wrong{border-color:var(--danger);background:var(--danger-soft)}
body.ui-ios .revfeed{
  border:1px solid var(--glass-line);border-radius:14px;background:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
body.ui-ios .revfeed .fnext{height:32px;padding:0 13px;border-radius:16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent);font-size:12.5px;font-weight:500}
body.ui-ios .rwplay{background:transparent;border:1px solid var(--line);color:var(--accent)}
body.ui-ios .revinp{height:50px;border-radius:12px;background:var(--field);border:1px solid var(--line);font-family:var(--sans)}
body.ui-ios .revinok{height:50px;border-radius:12px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 24%,transparent);color:var(--accent)}
body.ui-ios .revdone .rd-t{font-family:var(--sans);font-size:11.5px;letter-spacing:.04em}
body.ui-ios .revdone .rd-big{font-family:var(--sans);font-size:54px;font-weight:600;letter-spacing:-.04em}
body.ui-ios .revdone .rd-sub{font-size:12.5px;color:var(--ink-3)}

/* 空状态 / 页脚：不套大盒子 */
body.ui-ios .emptybox{padding:42px 12px;background:transparent;border:0;border-radius:0}
body.ui-ios .emptybox .et{font-family:var(--sans);font-size:17px;font-weight:500}
body.ui-ios .emptybox .es{font-size:12.5px;color:var(--ink-3);line-height:1.6}
body.ui-ios .empty{color:var(--ink-3)}
body.ui-ios .foot{font-family:var(--sans);font-size:10px;color:var(--ink-3);letter-spacing:0;margin-top:24px}
body.ui-ios .hint{font-size:11px;color:var(--ink-3)}
body.ui-ios .meta{font-size:11px;color:var(--ink-3)}
body.ui-ios .glogo{border-radius:18px}

@media (max-width:390px){
  body.ui-ios .sec-title,body.ui-ios .learn-title,body.ui-ios .herohead .ht{font-size:26px}
  body.ui-ios #pop .w1{font-size:28px}
  body.ui-ios .segs{width:calc(100% - 24px)}
}
@media (prefers-reduced-transparency:reduce){
  body.ui-ios .topbar::after,body.ui-ios .segs::before,body.ui-ios #minibar .inner,
  body.ui-ios .sheet,body.ui-ios .avdrop,body.ui-ios .dlgcard,body.ui-ios .gatecard,
  body.ui-ios #displaybox,body.ui-ios #player .pctl,body.ui-ios .revfeed{
    -webkit-backdrop-filter:none;backdrop-filter:none;background:var(--bg-2);
  }
}


/* ── 多语言标签 / 学习语言 ── */
.langbadge{display:inline-block;font-size:10px;line-height:1;padding:3px 6px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-ink);margin-right:5px;vertical-align:1px;
  font-family:var(--sans);font-weight:500;white-space:nowrap}
body.ui-ios .langbadge{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 18%,transparent);padding:2px 6px}
.learn-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}

.tagless{opacity:.7}

.chip .n{font-size:9.5px;opacity:.55;margin-left:3px;font-variant-numeric:tabular-nums}
</style>
</head>

<div id="gate" hidden></div>

</div>

</div>

    <button id="tab-songs"><svg class="tic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 6 4 14" /><path d="M12 6v14" /><path d="M8 8v12" /><path d="M4 4v16" /></svg><span>曲库</span></button>

  <main>
    <section id="view-home" class="view"></section>

    <div id="srcslot" hidden>
    <details class="src" id="srcbox">
      <summary>音频来源与设置</summary>

    </div>

    <div class="foot">
      歌词 / 时间轴：THBWiki · 网易云 · 仅供个人学习<br>
      <span id="genat"></span>
    </div>
  </main>
</div>

<!-- 迷你播放条 -->
<div id="minibar">
  <div class="inner">
    <img class="cover" id="mb-cover" alt="">
    <div class="meta" id="mb-meta">
      <div class="t1" id="p-now">—</div>
      <div class="t2" id="p-state"></div>
    </div>
    <button class="modechip" id="mb-loop" hidden>单句循环<svg class="ic in" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
    <button class="nbtn" id="mb-prev" title="上一首"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20" /> <line x1="5" x2="5" y1="19" y2="5" /></svg></button>
    <button id="playbtn"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon fill="currentColor" points="6 3 20 12 6 21 6 3" /></svg></button>
    <button class="nbtn" id="mb-next" title="下一首"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" /> <line x1="19" x2="19" y1="5" y2="19" /></svg></button>
  </div>
  <div class="mbprog"><i id="mb-prog"></i></div>
</div>

<!-- 全屏跟唱页 -->
<div id="player">
  <div class="phead">
    <button class="round" id="p-close" title="收起"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg></button>
    <img class="pcover" id="p-cover" alt="" hidden>
    <div class="t"><div class="a" id="p-title">—</div><div class="b" id="p-artist"></div></div>
    <button class="toolbtn" id="p-nosrc" hidden>绑定音频</button>
  </div>
  <div class="pstate" id="p-state2"></div>
  <button class="loopexit" id="p-loopexit" hidden>单句循环 · 退出</button>
  <div class="plyrics focus" id="plyric"></div>
  <div class="pctl">
    <div class="seekrow">
      <span class="time" id="p-time">0:00</span>
      <input type="range" id="p-seek" min="0" max="1000" value="0">
      <span class="time" id="p-dur">0:00</span>
    </div>
    <div class="btnrow">
      <button class="tracknav" id="p-ptrack" title="上一首"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="19 20 9 12 19 4 19 20" /> <line x1="5" x2="5" y1="19" y2="5" /></svg></button>
      <button class="toolbtn navbtn" id="p-prev" title="上一句歌词">上一句</button>
      <button class="big" id="p-play"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon fill="currentColor" points="6 3 20 12 6 21 6 3" /></svg></button>
      <button class="toolbtn navbtn" id="p-next" title="下一句歌词">下一句</button>
      <button class="tracknav" id="p-ntrack" title="下一首"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4" /> <line x1="19" x2="19" y1="5" y2="19" /></svg></button>
    </div>
    <div class="ctlrow">
      <button class="scope2" id="p-scope" role="switch" aria-checked="false" title="点一下切换：全曲 / 单句">
        <span class="half on" id="m-all">全曲</span><span class="half" id="m-loop">单句</span>
      </button>
      <button class="chipcycle" id="p-order" title="播放顺序">
        <span class="ic" id="p-order-ic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1" /> <circle cx="19" cy="12" r="1" /> <circle cx="5" cy="12" r="1" /></svg></span><span id="p-order-t">顺序</span>
      </button>
      <button class="chipcycle" id="p-sep" title="伴奏：点一下切换">
        <span class="ic" id="p-sep-ic"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13" /><circle cx="6" cy="18" r="3" /><circle cx="18" cy="16" r="3" /></svg></span><span id="p-sep-t">伴奏</span>
      </button>
      <button class="chipcycle" id="b-display" title="更多设置"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12h11" /> <path d="M10 18h11" /> <path d="M10 6h11" /> <path d="M4 10h2" /> <path d="M4 6h1v4" /> <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" /></svg></button>
    </div>
    <div id="displaybox">
      <div class="dr"><span>倍速</span><button id="p-rate">1.0x</button></div>
      <div class="dr"><span>词义（逐词中文）</span><button id="b-gloss">关</button></div>
      <div class="dr"><span>整句中文</span><button id="b-zh">开</button></div>
      <div class="dr"><span>逐词罗马音</span><button id="b-ruby">开</button></div>
      <div class="dr"><span>快捷键</span><button id="p-help">查看</button></div>
    </div>
  </div>
</div>

<!-- 通用弹窗（开屏更新公告 / 离开确认） -->
<div id="dlg" hidden></div>

<!-- 词条弹层 -->
<div class="sheet" id="pop">
  <div class="grab"></div>
  <div class="pop-body" id="p-body">
    <!-- 一阶段：词 / 假名 / 罗马音 / 释义，没有任何链接行；操作收成右上角图标 -->
    <div class="r1">
      <div class="r1-l">
        <span class="w1" id="p-word"></span>
        <span class="w2" id="p-reading"></span>
        <span class="w3" id="p-romaji"></span>
      </div>
      <div class="r1-r">
        <!-- 本次唯一的新增：词级星标。发音/已掌握/关闭 一概不动 -->
        <button class="icbtn star" id="p-star" title="星标" aria-label="星标"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z" /></svg></button>
        <button class="icbtn" id="p-speak" title="发音"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /></svg></button>
        <button class="icbtn" id="p-known" title="标为已掌握"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5" /></svg></button>
        <button class="icbtn" id="p-close2" title="关闭"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18" /> <path d="m6 6 12 12" /></svg></button>
      </div>
    </div>
    <!-- 绑定用的隐藏触发点：对应的动作由「点释义 / 点罗马音」触发，界面上不出现 -->
    <button hidden id="p-edit"></button>
    <button hidden id="p-roma"></button>
    <!-- 点释义就地改；点罗马音就地改 -->
    <div class="mg" id="p-meaning" title="点一下改释义"></div>
    <button class="toolbtn" id="p-meanclear" hidden style="margin-top:8px">清除自定义释义</button>
    <div class="row" id="p-editrow" hidden><input id="p-editinput" placeholder="写你自己的释义，回车保存"><button class="toolbtn" id="p-editclear" hidden>清除</button></div>
    <div class="mt" id="p-meta"></div>
    <div id="p-romabox" hidden>
      <div class="meta" id="p-romahint">选一个，或自己写</div>
      <div class="row" id="p-romacands"></div>
      <div class="row">
        <input class="sel" id="p-romainput" style="flex:1;min-width:140px;height:36px" placeholder="罗马音"
          autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" inputmode="latin">
        <button class="toolbtn on" id="p-romasave">保存</button>
        <button class="toolbtn" id="p-romareset">还原</button>
      </div>
    </div>

    <!-- 二阶段：只有例句，没有任何链接行；改释义 / 罗马音 走上面的就地编辑 -->
    <div class="pop-more-pane" id="p-more">
      <div class="pop-sec">
        <div class="pop-sec-t">出现的句子</div>
        <div id="p-exlist"></div>
      </div>
    </div>
  </div>
  <button class="pop-more" id="p-expand" aria-label="上拉看更多">
    <svg class="ic arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
    <span>上拉看更多</span>
  </button>
</div>

<script type="module" src="app.js?v=20261018t"></script>   <!-- 每次改完前端记得把 v 往后推一位，否则手机会被 Pages 的 10 分钟缓存挡住 -->
</body>
</html>
