<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>东方同人曲 学唱机</title>
<style>
:root{
  --bg:#090b10; --surface:#12161f; --surface2:#181d29; --line:rgba(255,255,255,.065);
  --ink:#eef1f6; --ink2:#a2acbe; --ink3:#6c7587;
  --accent:#ff5f45; --accent-soft:rgba(255,95,69,.14); --ok:#4ec98a;
  --p-n:#6fb6ff; --p-v:#ff9a76; --p-a:#ffd166; --p-na:#f2b366; --p-adv:#b79cff;
  --p-prt:#8b93a5; --p-aux:#79808f; --p-oth:#98a1b0;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}   /* 防止 display:inline-flex 这类规则把 hidden 覆盖掉 */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--ink2);text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}

/* ── 顶栏（渐进披露：搜索平时只是一个图标） ── */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;background:rgba(9,11,16,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{font-size:15px;font-weight:650;letter-spacing:.01em}
.brand small{color:var(--ink3);font-weight:400;font-size:11.5px;margin-left:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);display:grid;place-items:center;font-size:15px;transition:.15s}
.iconbtn:active{transform:scale(.95)}
.searchwrap{display:none;padding:8px 16px 0}
.searchwrap.on{display:block}
.searchbox{position:relative}
.searchbox input{width:100%;height:44px;padding:0 40px 0 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;outline:none}
.searchbox input:focus{border-color:rgba(255,95,69,.5)}
.searchbox .clr{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:9px;color:var(--ink3)}

/* ── 分段控件 ── */
.segs{display:flex;gap:6px;padding:10px 16px 2px}
.segs button{flex:1;height:38px;border-radius:11px;background:var(--surface);color:var(--ink3);font-size:13.5px;transition:.15s}
.segs button.on{background:var(--surface2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}

main{padding:10px 16px 132px}

/* ── 通用排版 ── */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 0 2px}
.sec-title{font-size:18px;font-weight:650;letter-spacing:.01em}
.sec-sub{font-size:11.5px;color:var(--ink3);margin-top:3px}
.bar{height:3px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.hair{height:1px;background:var(--line);margin:14px 0}
.hint{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.7}
.empty{padding:44px 8px;text-align:center;color:var(--ink3);font-size:13px}

/* ── 行（列表统一形态：左内容右操作，靠分隔线分群，不用卡片边框） ── */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:last-child{border-bottom:0}
.item:active{background:rgba(255,255,255,.03)}
.col{flex:1;min-width:0}
.l1{font-size:16px;font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .rd{font-size:12px;font-weight:400;color:var(--ink2);margin-left:7px}
.l2{font-size:13.5px;color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{font-size:11px;color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{font-size:9px;letter-spacing:2px;color:var(--ink3);white-space:nowrap}
.dots b{color:var(--accent);font-weight:400}
.tick{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);color:var(--ink3);font-size:13px;display:grid;place-items:center}
.tick.on{border-color:rgba(78,201,138,.5);color:var(--ok);background:rgba(78,201,138,.1)}
/* ── 导入网易云歌单 ── */
.tick.del{color:#ff8a7a}
.tick.del:hover{border-color:rgba(255,95,69,.5);background:var(--accent-soft)}
.impbox{border:1px solid var(--line);border-radius:13px;padding:11px 14px;margin:2px 0 14px;background:var(--surface)}
.impbox summary{font-size:13px;color:var(--ink2);cursor:pointer;list-style:none}
.impbox summary::-webkit-details-marker{display:none}
.impbox summary::before{content:'＋ ';color:var(--ink3)}
.impbox[open] summary::before{content:'－ '}
.impbox .sel{background:var(--surface2)}
.implog{margin-top:10px;max-height:240px;overflow:auto}
.improw{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.improw:last-child{border-bottom:0}
.improw b{font-weight:500;color:var(--ink);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.improw span{color:var(--ink3);font-size:11.5px;margin-left:auto;flex:0 0 auto}
.improw.bad span{color:#ff9f90}
.improw.ok span{color:var(--ok)}
.mini{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);color:var(--ink3);font-size:12px;display:grid;place-items:center}

/* 曲目封面 */
.cover{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--surface2);flex:0 0 auto}
.cover.big{width:58px;height:58px;border-radius:14px}

/* ── chips ── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font-size:12.5px;display:inline-flex;align-items:center}
.chip.on{background:var(--accent-soft);border-color:rgba(255,95,69,.45);color:#ffb9ad}
.sel{height:34px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12.5px}
.toolbtn{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:12.5px}
.toolbtn.on{background:var(--accent-soft);border-color:rgba(255,95,69,.45);color:#ffb9ad}
.btn-primary{height:40px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}

/* ── 歌词：一句一块，三层排版绑死在块里 ── */
.lblock{padding:11px 12px 12px;border-radius:13px;margin-bottom:2px;cursor:pointer;position:relative;transition:background .18s}
.lblock:active{background:rgba(255,255,255,.03)}
.lblock.playing{background:var(--accent-soft)}
.lblock.playing::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
.line{font-size:17.5px;line-height:1.75;letter-spacing:.005em}
.line.en{color:var(--ink2);font-size:15px}
.romaji{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px;padding-left:11px;border-left:2px solid rgba(255,255,255,.09)}
.lblock .zh{font-size:12.5px;color:var(--ink2);margin-top:4px;padding-left:11px;border-left:2px solid rgba(255,95,69,.35)}
.space{height:14px}
.line .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .12s}
.line .w:active{background:rgba(255,255,255,.09)}
.line .w.k-n{color:var(--p-n)} .line .w.k-v{color:var(--p-v)} .line .w.k-a{color:var(--p-a)}
.line .w.k-na{color:var(--p-na)} .line .w.k-adv{color:var(--p-adv)}
.line .w.k-prt,.line .w.k-aux{color:var(--p-prt)}
.line .w.k-conj,.line .w.k-int,.line .w.k-rent,.line .w.k-pref,.line .w.k-oth{color:var(--p-oth)}
.line .w.known{opacity:.55}
.line .g{display:none}
.line .r{display:none}
/* 逐词罗马音（跟唱用）：罗马音在词上方，中文在词下方，日语居中 */
body.ruby .line .w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;
  text-align:center;max-width:9.5em;margin:0 1px;line-height:1.35}
body.ruby .line .r{display:block;font-size:9.5px;line-height:1.25;color:var(--ink3);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;white-space:nowrap}
body.gloss .line .w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;text-align:center;max-width:9.5em}
body.gloss .line .g{display:block;font-size:9.5px;line-height:1.25;color:var(--ink3);font-weight:400;white-space:normal;padding:0 2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin:2px 2px 10px}
.legend i{font-style:normal;margin-right:4px}

/* ── 迷你播放条（全站唯一的播放控件） ── */
#minibar{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:0 12px calc(10px + env(safe-area-inset-bottom));}
#minibar.on{transform:none}
#minibar .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:16px;
  background:rgba(24,29,41,.96);backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.07)}
#minibar .meta{flex:1;min-width:0;cursor:pointer}
#minibar .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minibar .t2{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playbtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px;display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 6px 18px rgba(255,95,69,.35)}
#playbtn:active{transform:scale(.94)}
.loading #playbtn{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── 全屏跟唱页 ── */
#player{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#0d1017,#090b10 40%);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.on{transform:none;visibility:visible}
#player .phead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
#player .phead .t{flex:1;min-width:0}
#player .phead .a{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .phead .b{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .plytoggles{display:flex;gap:7px;padding:10px 16px 0}
#player .plytoggles .chip{height:28px;font-size:12px}
#player .plyrics{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 16px 20px;-webkit-overflow-scrolling:touch}
#player .pctl{flex:0 0 auto}
#player .pctl{border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(9,11,16,.7)}
#player .seekrow{display:flex;align-items:center;gap:10px}
#player input[type=range]{flex:1;min-width:0;height:18px;accent-color:var(--accent)}
#player .time{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#player .btnrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
#player .round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);display:grid;place-items:center;font-size:14px}
#player .round.on{border-color:rgba(255,95,69,.5);color:#ffb9ad;background:var(--accent-soft)}
#player .big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:#fff;font-size:22px;display:grid;place-items:center;
  box-shadow:0 8px 22px rgba(255,95,69,.35)}
#player .big:active{transform:scale(.95)}
.modeseg{display:flex;background:var(--surface);border-radius:11px;padding:2px;gap:2px;flex:0 0 auto}
.modeseg button{height:26px;padding:0 10px;border-radius:9px;font-size:11.5px;color:var(--ink3)}
.modeseg button.on{background:var(--accent-soft);color:#ffb9ad;font-weight:600}
.modechip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:11.5px;display:inline-flex;align-items:center;gap:6px}
.modechip.on{background:var(--accent-soft);border-color:rgba(255,95,69,.45);color:#ffb9ad}

/* 跟唱聚焦：有当前句时才把其他句压暗，否则整屏都清楚 */
#plyric .lblock{transition:opacity .25s}
#plyric.has-active .lblock{opacity:.34}
#plyric.has-active .lblock.playing{opacity:1}
#plyric.has-active .lblock.playing .line{font-size:20px;font-weight:600}

/* ── 底部弹层（词条 / 设置） ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  background:var(--surface2);border-radius:18px 18px 0 0;border:1px solid rgba(255,255,255,.08);box-shadow:0 -14px 40px rgba(0,0,0,.5);
  max-height:74vh;overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin:0 auto 10px}
#pop .r1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#pop .w1{font-size:22px;font-weight:700}
#pop .w2{font-size:13px;color:var(--p-n)}
#pop .w3{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,Menlo,monospace}
#pop .mg{font-size:15px;margin-top:8px;color:#ffe9df}
#pop .mt{font-size:11.5px;color:var(--ink3);margin-top:6px}
#pop .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#pop .acts button{height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);font-size:12.5px;color:var(--ink2)}
#pop .acts button.k{border-color:rgba(78,201,138,.4);color:#a5e6c2}
#pop input{width:100%;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--ink)}

details.src{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
details.src summary{font-size:12px;color:var(--ink3);cursor:pointer;padding:6px 0}
.foot{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:22px;line-height:1.9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--ink3)}
.meta{font-size:11.5px;color:var(--ink3)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">东方同人曲 学唱机 <small id="headstat">载入中…</small></div>
  <button class="iconbtn" id="btn-search" title="搜索">搜</button>
</div>

<div class="searchwrap" id="searchwrap">
  <div class="searchbox">
    <input id="q" placeholder="搜词 / 释义 / 曲名 / 社团 / 原曲…" autocomplete="off">
    <button class="clr" id="q-clear" title="清空">×</button>
  </div>
</div>

<div class="wrap">
  <nav class="segs">
    <button id="tab-learn" class="on">学词</button>
    <button id="tab-songs">曲库</button>
    <button id="tab-mine">生词本</button>
  </nav>

  <main>
    <section id="view-learn" class="view"></section>
    <section id="view-songs" class="view" hidden></section>
    <section id="view-mine" class="view" hidden></section>
    <section id="view-word" class="view" hidden></section>
    <section id="view-track" class="view" hidden></section>
    <section id="view-search" class="view" hidden></section>

    <details class="src" id="srcbox">
      <summary>音频来源与设置</summary>
      <div class="row"><span id="srcinfo" class="meta"></span></div>
      <div class="row">
        <label>网易云歌曲 ID／链接</label>
        <input id="nidinput" class="sel" style="flex:1;min-width:170px;height:36px" placeholder="粘贴链接或数字 ID">
        <button class="toolbtn" id="nidsave">绑定到这首</button>
      </div>
      <div class="row">
        <label>本地音频</label>
        <input type="file" id="audiofile" accept="audio/*">
        <button class="toolbtn" id="audioclear">清除</button>
      </div>
      <div class="hint">已接自建对象存储直链的曲目不会再走第三方解析接口。绑定关系只存在你自己的浏览器里。</div>
    </details>

    <div class="foot">
      歌词/时间轴/译文：THBWiki 歌词服务 + 网易云 · 难度参考《新版 标准日本语》与 JLPT 词汇表<br>
      <span id="genat"></span>
    </div>
  </main>
</div>

<!-- 迷你播放条 -->
<div id="minibar">
  <div class="inner">
    <img class="cover" id="mb-cover" alt="">
    <div class="meta" id="mb-meta">
      <div class="t1" id="p-now">—</div>
      <div class="t2" id="p-state"></div>
    </div>
    <button class="modechip" id="mb-loop" hidden>单句循环 ✕</button>
    <button id="playbtn">▶</button>
  </div>
</div>

<!-- 全屏跟唱页 -->
<div id="player">
  <div class="phead">
    <button class="round" id="p-close" title="收起">⌄</button>
    <div class="t"><div class="a" id="p-title">—</div><div class="b" id="p-artist"></div></div>
    <div class="modeseg" id="p-mode">
      <button id="m-all" class="on">整首</button>
      <button id="m-loop">单句循环</button>
    </div>
  </div>
  <div class="plytoggles">
    <button class="chip" id="b-gloss">词义</button>
    <button class="chip" id="b-zh">中文</button>
    <button class="chip" id="b-ruby">逐词罗马音</button>
  </div>
  <div class="plyrics focus" id="plyric"></div>
  <div class="pctl">
    <div class="seekrow">
      <span class="time" id="p-time">0:00</span>
      <input type="range" id="p-seek" min="0" max="1000" value="0">
      <span class="time" id="p-dur">0:00</span>
    </div>
    <div class="btnrow">
      <button class="round" id="p-loop" title="单句循环">↻</button>
      <button class="round" id="p-prev" title="上一句">⟨</button>
      <button class="big" id="p-play">▶</button>
      <button class="round" id="p-next" title="下一句">⟩</button>
      <button class="round" id="p-rate" title="倍速">1.0x</button>
    </div>
  </div>
</div>

<!-- 词条弹层 -->
<div class="sheet" id="pop">
  <div class="grab"></div>
  <div class="r1">
    <span class="w1" id="p-word"></span>
    <span class="w2" id="p-reading"></span>
    <span class="w3" id="p-romaji"></span>
  </div>
  <div class="mg" id="p-meaning"></div>
  <div class="mt" id="p-ex"></div>
  <div class="row" id="p-editrow" style="display:none;margin-top:10px">
    <input id="p-editinput" placeholder="写你自己的释义，回车保存">
  </div>
  <div class="mt" id="p-meta"></div>
  <div class="acts">
    <button id="p-speak">读这个词</button>
    <button id="p-detail">词条详情</button>
    <button id="p-lines">出现的句子</button>
    <button id="p-edit">改释义</button>
    <button class="k" id="p-known">标为已掌握</button>
    <button id="p-close2">关闭</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
