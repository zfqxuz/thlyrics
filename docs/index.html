<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TH Lyrics</title>
<style>
:root{
  /* 一条视觉路线：墨蓝底 + 暖白纸 + 一点朱红。不用渐变、发光、玻璃拟态。 */
  --bg:#0f1420; --surface:#151b28; --surface2:#1b2331; --line:rgba(242,237,228,.10);
  --ink:#f2ede4; --ink2:#a7b0bf; --ink3:#6e7788; --paper:#f4efe6;
  --accent:#d4503c; --accent-soft:rgba(212,80,60,.16); --ok:#5fbf8f;
  --danger:#d4503c; --danger-soft:rgba(212,80,60,.14);
  /* 字号只准用这六档 */
  --fs-hero:22px; --fs-title:18px; --fs-lyric:24px; --fs-body:15px; --fs-sub:13px; --fs-meta:11.5px;
  /* 间距也用固定尺度，别再每块单独调 */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --p-n:#6fb6ff; --p-v:#ff9a76; --p-a:#ffd166; --p-na:#f2b366; --p-adv:#b79cff;
  --p-prt:#8b93a5; --p-aux:#79808f; --p-oth:#98a1b0;
  /* 语义色：暖白主题里会整体换掉 */
  --warm-ink:#ffe9df; --accent-ink:#ffb9ad; --accent-ink2:#f0a294; --danger-ink:#ff9f90; --ok-ink:#a5e6c2;
  --hov:rgba(255,255,255,.03); --track:rgba(255,255,255,.07); --press:rgba(255,255,255,.09);
  --sheetline:rgba(255,255,255,.08); --grab:rgba(255,255,255,.15); --bar:rgba(242,237,228,.10);
  --shadow:0 -14px 40px rgba(0,0,0,.5);
}
/* 暖白（白天）主题：只换 token，不动布局 */
body.warm{
  --bg:#f7f1e6; --surface:#fffaf1; --surface2:#f0e6d6; --line:rgba(90,64,36,.16);
  --ink:#2e2823; --ink2:#6a5f52; --ink3:#9b8f80; --paper:#fffaf1;
  --accent:#c1462f; --accent-soft:rgba(193,70,47,.13); --ok:#2f7f57; --danger:#c1462f; --danger-soft:rgba(193,70,47,.12);
  --p-n:#2c66a8; --p-v:#b0421f; --p-a:#8a6310; --p-na:#9c5a10; --p-adv:#6549ab;
  --p-prt:#6b7280; --p-aux:#5c6470; --p-oth:#787f8a;
  --warm-ink:#7c3a28; --accent-ink:#a8381f; --accent-ink2:#a8381f; --danger-ink:#a8381f; --ok-ink:#266b49;
  --hov:rgba(120,90,50,.06); --track:rgba(120,90,50,.12); --press:rgba(120,90,50,.16);
  --sheetline:rgba(120,90,50,.16); --grab:rgba(120,90,50,.28); --bar:rgba(120,90,50,.14);
  --shadow:0 -14px 34px rgba(90,60,30,.16);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}   /* 防止 display:inline-flex 这类规则把 hidden 覆盖掉 */
html,body{height:100%}
body{background:var(--bg);color:var(--ink);line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
a{color:var(--ink2);text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
.wrap{max-width:720px;margin:0 auto}

/* ── 顶栏（渐进披露：搜索平时只是一个图标） ── */
.topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 16px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-size:15px;font-weight:650;letter-spacing:.01em}
.brand small{color:var(--ink3);font-weight:400;font-size:11.5px;margin-left:8px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);display:grid;place-items:center;font-size:15px;transition:.15s}
.iconbtn:active{transform:scale(.95)}
.searchwrap{display:none;padding:8px 16px 0}
.searchwrap.on{display:block}
.searchbox{position:relative}
.searchbox input{width:100%;height:44px;padding:0 40px 0 14px;border-radius:13px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-size:15px;outline:none}
.searchbox input:focus{border-color:rgba(255,95,69,.5)}
.searchbox .clr{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:9px;color:var(--ink3)}

/* ── 分段控件 ── */
.segs{display:flex;gap:6px;padding:10px 16px 2px}
.segs button{flex:1;height:38px;border-radius:11px;background:var(--surface);color:var(--ink3);font-size:13.5px;transition:.15s}
.segs button.on{background:var(--surface2);color:var(--ink);font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}

main{padding:var(--sp-4) var(--sp-4) 140px}

/* ── 通用排版 ── */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-2) 0 2px}
.sec-title{font-size:var(--fs-title);font-weight:650;letter-spacing:.01em}
.sec-sub{font-size:var(--fs-meta);color:var(--ink3);margin-top:3px}
.bar{height:3px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.hair{height:1px;background:var(--line);margin:var(--sp-5) 0}
.hint{font-size:11.5px;color:var(--ink3);margin-top:10px;line-height:1.7}
.empty{padding:44px 8px;text-align:center;color:var(--ink3);font-size:13px}

/* ── 行（列表统一形态：左内容右操作，靠分隔线分群，不用卡片边框） ── */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.item:last-child{border-bottom:0}
.item:active{background:var(--hov)}
.col{flex:1;min-width:0}
.l1{font-size:var(--fs-body);font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .rd{font-size:12px;font-weight:400;color:var(--ink2);margin-left:7px}
.l2{font-size:var(--fs-sub);color:var(--ink2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{font-size:var(--fs-meta);color:var(--ink3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{font-size:9px;letter-spacing:2px;color:var(--ink3);white-space:nowrap}
.dots b{color:var(--accent);font-weight:400}
.tick{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);color:var(--ink3);font-size:13px;display:grid;place-items:center}
.tick.on{border-color:rgba(78,201,138,.5);color:var(--ok);background:rgba(78,201,138,.1)}
/* ── 导入网易云歌单 ── */
.tick.del{color:#ff8a7a}
.tick.del:hover{border-color:rgba(255,95,69,.5);background:var(--accent-soft)}
.impbox{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 var(--sp-4);margin:var(--sp-2) 0 var(--sp-4);background:none}
.impbox summary{font-size:13px;color:var(--ink2);cursor:pointer;list-style:none}
.impbox summary::-webkit-details-marker{display:none}
.impbox summary::before{content:'＋ ';color:var(--ink3)}
.impbox[open] summary::before{content:'－ '}
.impbox .sel{background:var(--surface2)}
.implog{margin-top:10px;max-height:240px;overflow:auto}
.improw{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--line);color:var(--ink2)}
.improw:last-child{border-bottom:0}
.improw b{font-weight:500;color:var(--ink);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.improw span{color:var(--ink3);font-size:11.5px;margin-left:auto;flex:0 0 auto}
.improw.bad span{color:var(--danger-ink)}
.improw.ok span{color:var(--ok)}
.segtext{display:flex;gap:2px;font-size:12.5px}
.segtext button{padding:2px 7px;border-radius:8px;color:var(--ink3)}
.segtext button.on{color:var(--ink);background:var(--surface2)}
/* ── 按社团/专辑分组 ── */
.grp{border-bottom:1px solid var(--line)}
.grp>summary{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;font-size:14px;font-weight:600;cursor:pointer;list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:'▾';color:var(--ink3);font-size:11px;margin-left:6px}
.grp[open]>summary::after{content:'▴'}
.grp>summary .meta{flex:1;text-align:right;font-weight:400}
.grp .list{padding-left:6px;border-left:1px solid var(--line);margin-bottom:6px}
.mini{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);color:var(--ink3);font-size:12px;display:grid;place-items:center}

/* 曲目封面 */
.cover{width:46px;height:46px;border-radius:11px;object-fit:cover;background:var(--surface2);flex:0 0 auto}
.cover.big{width:58px;height:58px;border-radius:14px}

/* ── chips ── */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 4px}
.filtrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.filtrow>*{flex:1 1 44%}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink2);font-size:var(--fs-meta);display:inline-flex;align-items:center}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.sel{height:34px;padding:0 10px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:var(--fs-sub)}
.toolbtn{height:34px;padding:0 var(--sp-3);border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-size:var(--fs-sub)}
.toolbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:18px}
#gate[hidden]{display:none}
.gatecard{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.gatecard .gtitle{font-size:20px;color:var(--warm-ink)}
.gatecard .gsub{font-size:12px;color:var(--ink2);line-height:1.6}
.gatecard .sel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:0 12px;font-size:14px}
.gatecard .row{display:flex;gap:8px}
.gatecard .row button{flex:1}
.gatecard .gmsg{font-size:12px;color:var(--p-a);min-height:16px}
.accbox{margin:var(--sp-4) 0 var(--sp-2);padding:0 0 var(--sp-4);border-bottom:1px solid var(--line)}
.accbox.on{border-bottom-color:rgba(212,80,60,.35)}
.accbox .l1{font-size:14px;color:var(--warm-ink)}
.accbox .l2{font-size:11.5px;color:var(--ink2);line-height:1.55;margin-top:3px}
.accbox .sel{height:38px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:0 10px;font-size:13px}
.btn-primary{height:40px;padding:0 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}

/* ── 按钮三档：主（朱红实心）/ 次（描边）/ 危险（红字） ── */
.btn-main{height:44px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--paper);font-weight:600;font-size:var(--fs-body)}
.btn-ghost{height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--line);color:var(--ink2);font-size:var(--fs-sub)}
.btn-danger{height:34px;padding:0 12px;border-radius:11px;border:1px solid var(--danger-soft);color:var(--accent-ink2);font-size:var(--fs-meta)}

/* ── 搜索/列表的分段标题 ── */
.srhead{font-size:var(--fs-meta);color:var(--ink3);letter-spacing:.14em;margin:var(--sp-5) 0 var(--sp-1)}
.srhead b{color:var(--ink2);font-weight:500;letter-spacing:0}

/* ── 复习卡（生词本的学习闭环） ── */
.revwrap{max-width:520px;margin:0 auto}
.revcard{padding:var(--sp-5) var(--sp-3);text-align:center;min-height:240px;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
.revcard .rw{font-size:34px;font-weight:700;letter-spacing:.02em}
.revcard .rr{font-size:var(--fs-sub);color:var(--ink2)}
.revcard .rm{font-size:var(--fs-title);color:var(--paper);margin-top:6px}
.revcard .rx{font-size:var(--fs-sub);color:var(--ink2);line-height:1.7}
.revbar{height:3px;border-radius:3px;background:var(--bar);overflow:hidden;margin:14px 0}
.revbar i{display:block;height:100%;background:var(--accent)}
.revacts{display:flex;gap:10px;margin-top:16px}
.revacts button{flex:1;height:46px;border-radius:12px;border:1px solid var(--line);color:var(--ink2);font-size:var(--fs-body)}
.revacts button.k{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}

/* ── 空状态：说清楚 + 给下一步 ── */
.emptybox{padding:34px 10px;text-align:center}
.emptybox .et{font-size:var(--fs-body);color:var(--ink);font-weight:600}
.emptybox .es{font-size:var(--fs-sub);color:var(--ink3);margin-top:6px;line-height:1.7}
.emptybox .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ── 首页（入口只有一条主路径：找歌 → 选歌 → 学唱） ── */
.herohead{background:var(--surface);border-bottom:1px solid var(--line);padding:18px 16px 16px;margin:-10px -16px 16px}
.herohead .ht{font-size:var(--fs-hero);font-weight:700;letter-spacing:.01em}
.herohead .hs{font-size:var(--fs-sub);color:var(--ink2);margin-top:4px}
.herohead .hln{display:flex;gap:8px;margin-top:12px}
.herohead .hln button{font-size:var(--fs-meta);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.homesearch{display:flex;gap:8px;margin-top:12px}
.homesearch input{flex:1;min-width:0;height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:var(--fs-body);outline:none}
.homesearch button{width:64px;border-radius:12px;background:var(--accent);color:var(--paper);font-weight:600;font-size:var(--fs-sub)}
.nowcard{padding:var(--sp-5) 0 var(--sp-4);border-bottom:1px solid var(--line)}
.nowcard .k{font-size:var(--fs-meta);color:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.nowcard .t{font-size:var(--fs-title);font-weight:650;margin-top:7px}
.nowcard .a{font-size:var(--fs-sub);color:var(--ink2);margin-top:3px}
.nowcard .acts{display:flex;gap:8px;margin-top:14px}
.wordstrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.wordstrip button{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:var(--fs-sub)}

/* ── 显示抽屉：三个开关收进来，默认只留日文 + 读音 ── */
#displaybox{position:absolute;right:12px;bottom:calc(100% + 8px);z-index:5;display:none;min-width:200px;padding:10px 12px;border-radius:12px;
  border:1px solid var(--line);background:var(--surface2)}
#displaybox.on{display:block}
#displaybox .dr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;font-size:var(--fs-sub)}
#displaybox .dr button{height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink3);font-size:var(--fs-meta)}
#displaybox .dr button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink2);font-weight:600}

/* ── 歌词：一句一块，三层排版绑死在块里 ── */
.lblock{padding:8px 11px 9px;border-radius:12px;margin-bottom:2px;cursor:pointer;position:relative;transition:background .18s}
.lblock:active{background:var(--hov)}
.lblock.playing{background:var(--accent-soft)}
.lblock.playing::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent)}
.line{font-size:16.5px;line-height:1.9;letter-spacing:.01em;min-height:2.35em;display:block}
.line.en{color:var(--ink2);font-size:15px}
.romaji{font-size:11px;color:var(--ink3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;margin-top:4px}
.lblock .zh{font-size:13px;color:var(--ink2);margin-top:4px;padding-left:10px;border-left:2px solid rgba(212,80,60,.32)}
.space{height:10px}
.line .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .12s}
.line .w:active{background:var(--press)}
.line .w.k-n{color:var(--p-n)} .line .w.k-v{color:var(--p-v)} .line .w.k-a{color:var(--p-a)}
.line .w.k-na{color:var(--p-na)} .line .w.k-adv{color:var(--p-adv)}
.line .w.k-prt,.line .w.k-aux{color:var(--p-prt)}
.line .w.k-conj,.line .w.k-int,.line .w.k-rent,.line .w.k-pref,.line .w.k-oth{color:var(--p-oth)}
.line .w.known{opacity:.55}
.line .g{display:none}
.line .r{display:none}
/* 逐词罗马音（跟唱用）：罗马音在词上方，中文在词下方，日语居中 */
body.ruby .line .w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;
  text-align:center;max-width:12em;margin:0 1px;line-height:1.35}
body.ruby .line .r{display:block;min-height:1.3em;font-size:10px;line-height:1.3;color:var(--ink3);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:400;white-space:nowrap}
body.gloss .line .w{display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;text-align:center;max-width:9.5em}
body.gloss .line .g{display:block;font-size:9.5px;line-height:1.25;color:var(--ink3);font-weight:400;white-space:normal;padding:0 2px}
.line .w[data-fixed="1"] .r{color:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--ink3);margin:2px 2px 10px}
.legend i{font-style:normal;margin-right:4px}

/* ── 迷你播放条（全站唯一的播放控件） ── */
#minibar{position:fixed;left:0;right:0;bottom:0;z-index:50;transform:translateY(120%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  padding:0 12px calc(10px + env(safe-area-inset-bottom));}
#minibar.on{transform:none}
#minibar .inner{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:14px;
  background:var(--surface2);border:1px solid var(--line)}
#minibar .meta{flex:1;min-width:0;cursor:pointer}
#minibar .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#minibar .t2{font-size:10.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#playbtn{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:16px;display:grid;place-items:center;flex:0 0 auto}
#playbtn:active{transform:scale(.94)}
.loading #playbtn{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── 全屏跟唱页 ── */
#player{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#player.on{transform:none;visibility:visible}
#player .phead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
#player .phead .t{flex:1;min-width:0}
#player .phead .a{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .phead .b{font-size:11px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .plytoggles{display:flex;gap:7px;padding:10px 16px 0}
#player .plytoggles .chip{height:28px;font-size:12px}
#player .plyrics{flex:1 1 auto;min-height:0;overflow-y:auto;padding:8px 16px 20px;-webkit-overflow-scrolling:touch}
#player .pctl{flex:0 0 auto}
#player .pctl{position:relative;border-top:1px solid var(--line);padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg)}
#player .ctlrow{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#player .seekrow{display:flex;align-items:center;gap:10px}
#player input[type=range]{flex:1;min-width:0;height:18px;accent-color:var(--accent)}
#player .time{font-size:10.5px;color:var(--ink3);font-variant-numeric:tabular-nums;min-width:34px;text-align:center}
#player .btnrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
#player .round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);color:var(--ink2);display:grid;place-items:center;font-size:14px}
#player .round.on{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
#player .big{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:22px;display:grid;place-items:center}
#player .big:active{transform:scale(.95)}
.modeseg{display:flex;background:var(--surface);border-radius:11px;padding:2px;gap:2px;flex:0 0 auto}
.modeseg button{height:26px;padding:0 10px;border-radius:9px;font-size:11.5px;color:var(--ink3)}
.modeseg button.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.modechip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);color:var(--ink2);font-size:11.5px;display:inline-flex;align-items:center;gap:6px}
.modechip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

/* 跟唱聚焦：有当前句时才把其他句压暗，否则整屏都清楚 */
#plyric .lblock{transition:opacity .25s}
#plyric.has-active .lblock{opacity:.26}
#plyric.has-active .lblock.playing{opacity:1}
/* 当前句靠“重量 + 颜色 + 左侧朱红条”突出，不放大字号 —— 放大字号会把整屏顶上去（这条踩过坑） */
#plyric.has-active .lblock.playing .line{font-weight:650;letter-spacing:.01em;color:var(--paper)}

/* ── 底部弹层（词条 / 设置） ── */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;transform:translateY(110%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  background:var(--surface2);border-radius:18px 18px 0 0;border:1px solid var(--sheetline);box-shadow:var(--shadow);
  max-height:74vh;overflow-y:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet.on{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--grab);margin:0 auto 10px}
#pop .r1{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#pop .w1{font-size:22px;font-weight:700}
#pop .w2{font-size:13px;color:var(--p-n)}
#pop .w3{font-size:11.5px;color:var(--ink3);font-family:ui-monospace,Menlo,monospace}
#pop .mg{font-size:15px;margin-top:8px;color:var(--warm-ink)}
#pop .mt{font-size:11.5px;color:var(--ink3);margin-top:6px}
#pop .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#pop .acts button{height:34px;padding:0 13px;border-radius:11px;border:1px solid var(--line);background:var(--hov);font-size:12.5px;color:var(--ink2)}
#pop .acts button.k{border-color:var(--ok);color:var(--ok-ink)}
#pop input{width:100%;height:38px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}

details.src{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
details.src summary{font-size:12px;color:var(--ink3);cursor:pointer;padding:6px 0}
.foot{font-size:10.5px;color:var(--ink3);text-align:center;margin-top:22px;line-height:1.9}

/* ── 专辑：两列网格（封面 + 专辑名） ── */
.albumgrid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3);margin-top:var(--sp-3)}
.albumcard{cursor:pointer}
.albumcard .cov{aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center}
.albumcard .cov img{width:100%;height:100%;object-fit:cover;display:block}
.albumcard .cov .ph{font-size:22px;color:var(--ink3)}
.albumcard .nm{font-size:var(--fs-sub);font-weight:600;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albumcard .mt{font-size:var(--fs-meta);color:var(--ink3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albumcard:active .cov{transform:scale(.98)}

/* ── 头像 / 头像下拉菜单 / 黑白开关 ── */
.avwrap{position:relative}
.avbtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);overflow:hidden;display:grid;place-items:center}
.av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:14px;font-weight:650;color:var(--ink2);background:var(--surface2)}
.av.av24{width:24px;height:24px;font-size:11px;flex:0 0 auto}
.av.av48{width:48px;height:48px;font-size:19px;flex:0 0 auto}
.avdrop{position:absolute;right:0;top:calc(100% + 8px);z-index:60;min-width:200px;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
.avdrop[hidden]{display:none}
.avdrop .mi{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border-radius:10px;font-size:var(--fs-sub);color:var(--ink);text-align:left}
.avdrop .mi:hover{background:var(--hov)}
.avdrop .sep{height:1px;background:var(--line);margin:5px 2px}
.sw{width:42px;height:24px;border-radius:999px;background:var(--surface);border:1px solid var(--line);position:relative;flex:0 0 auto;transition:.18s}
.sw i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--ink3);transition:.18s}
.sw.on{background:var(--accent-soft);border-color:var(--accent)}
.sw.on i{left:20px;background:var(--accent)}
.avpick{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink2);cursor:pointer}
.avpick .av{width:40px;height:40px;border:1px dashed var(--line);font-size:16px}

/* ── 设置行（我的页） ── */
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .k{font-size:var(--fs-body)}
.setrow .k small{display:block;font-size:var(--fs-meta);color:var(--ink3);font-weight:400;margin-top:2px}
.sect{font-size:var(--fs-meta);color:var(--ink3);letter-spacing:.14em;margin:var(--sp-5) 0 var(--sp-1)}
.code{width:100%;min-height:76px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px;
  font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;resize:vertical}
.marktag{font-size:10.5px;color:var(--ink3);letter-spacing:.02em}
.marktag.on{color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--ink3)}
.meta{font-size:11.5px;color:var(--ink3)}
</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="topbar">
  <div class="brand" id="brand" style="cursor:pointer">TH Lyrics <small id="headstat"></small></div>
  <div class="row" style="gap:8px;flex-wrap:nowrap">
    <button class="iconbtn" id="btn-search" title="搜索">搜</button>
    <div class="avwrap">
      <button class="avbtn" id="btn-av" title="我的"></button>
      <div class="avdrop" id="avdrop" hidden></div>
    </div>
  </div>
</div>

<div class="searchwrap" id="searchwrap">
  <div class="searchbox">
    <input id="q" placeholder="搜词 / 释义 / 曲名 / 社团 / 原曲…" autocomplete="off">
    <button class="clr" id="q-clear" title="清空">×</button>
  </div>
</div>

<div class="wrap">
  <nav class="segs" id="tabs">
    <button id="tab-learn" class="on">学词</button>
    <button id="tab-songs">曲库</button>
    <button id="tab-mine">生词本</button>
    <button id="tab-me">我的</button>
  </nav>

  <main>
    <section id="view-home" class="view"></section>
    <section id="view-learn" class="view" hidden></section>
    <section id="view-songs" class="view" hidden></section>
    <section id="view-mine" class="view" hidden></section>
    <section id="view-word" class="view" hidden></section>
    <section id="view-track" class="view" hidden></section>
    <section id="view-search" class="view" hidden></section>
    <section id="view-review" class="view" hidden></section>
    <section id="view-me" class="view" hidden></section>
    <section id="view-admin" class="view" hidden></section>

    <div id="srcslot" hidden>
    <details class="src" id="srcbox">
      <summary>音频来源与设置</summary>
      <div class="row"><span id="srcinfo" class="meta"></span></div>
      <div class="row">
        <label>网易云歌曲 ID／链接</label>
        <input id="nidinput" class="sel" style="flex:1;min-width:170px;height:36px" placeholder="粘贴链接或数字 ID">
        <button class="toolbtn" id="nidsave">绑定到这首</button>
      </div>
    </details>
    </div>

    <div class="foot">
      歌词 / 时间轴：THBWiki · 网易云 · 仅供个人学习<br>
      <span id="genat"></span>
    </div>
  </main>
</div>

<!-- 迷你播放条 -->
<div id="minibar">
  <div class="inner">
    <img class="cover" id="mb-cover" alt="">
    <div class="meta" id="mb-meta">
      <div class="t1" id="p-now">—</div>
      <div class="t2" id="p-state"></div>
    </div>
    <button class="modechip" id="mb-loop" hidden>单句循环 ✕</button>
    <button id="playbtn">▶</button>
  </div>
</div>

<!-- 全屏跟唱页 -->
<div id="player">
  <div class="phead">
    <button class="round" id="p-close" title="收起">⌄</button>
    <div class="t"><div class="a" id="p-title">—</div><div class="b" id="p-artist"></div></div>
    <button class="toolbtn" id="p-nosrc" hidden>绑定音频</button>
  </div>
  <div class="plyrics focus" id="plyric"></div>
  <div class="pctl">
    <div class="seekrow">
      <span class="time" id="p-time">0:00</span>
      <input type="range" id="p-seek" min="0" max="1000" value="0">
      <span class="time" id="p-dur">0:00</span>
    </div>
    <div class="btnrow">
      <button class="round" id="p-prev" title="上一句">⟨</button>
      <button class="big" id="p-play">▶</button>
      <button class="round" id="p-next" title="下一句">⟩</button>
    </div>
    <div class="ctlrow">
      <div class="modeseg" id="p-mode">
        <button id="m-all" class="on">整首</button>
        <button id="m-loop">单句循环</button>
      </div>
      <button class="modechip" id="b-display" title="更多设置">⋯</button>
    </div>
    <div id="displaybox">
      <div class="dr"><span>倍速</span><button id="p-rate">1.0x</button></div>
      <div class="dr"><span>词义（逐词中文）</span><button id="b-gloss">关</button></div>
      <div class="dr"><span>整句中文</span><button id="b-zh">开</button></div>
      <div class="dr"><span>逐词罗马音</span><button id="b-ruby">开</button></div>
    </div>
  </div>
</div>

<!-- 词条弹层 -->
<div class="sheet" id="pop">
  <div class="grab"></div>
  <div class="r1">
    <span class="w1" id="p-word"></span>
    <span class="w2" id="p-reading"></span>
    <span class="w3" id="p-romaji"></span>
  </div>
  <div class="mg" id="p-meaning"></div>
  <div class="mt" id="p-meta"></div>
  <div class="acts">
    <button class="k" id="p-known">标为已掌握</button>
    <button id="p-goto">去这句</button>
    <button id="p-roma">罗马音</button>
    <button id="p-more">更多</button>
    <button id="p-close2">关闭</button>
  </div>
  <div id="p-romabox" hidden>
    <div class="meta" style="margin-top:10px">听不准就改：下面几个是备选，也可以自己写（改完立刻生效）</div>
    <div class="row" id="p-romacands" style="margin-top:8px"></div>
    <div class="row" style="margin-top:8px">
      <input class="sel" id="p-romainput" style="flex:1;min-width:140px;height:36px" placeholder="罗马音" autocomplete="off">
      <button class="toolbtn on" id="p-romasave">保存</button>
      <button class="toolbtn" id="p-romareset">还原</button>
    </div>
  </div>
  <div id="p-morebox" hidden>
    <div class="mt" id="p-ex"></div>
    <div id="p-exlist"></div>
    <div class="row" id="p-editrow" style="display:none;margin-top:10px">
      <input id="p-editinput" placeholder="写你自己的释义，回车保存">
    </div>
    <div class="row" style="margin-top:10px">
      <button class="toolbtn" id="p-speak">读这个词</button>
      <button class="toolbtn" id="p-detail">词条详情</button>
      <button class="toolbtn" id="p-lines">出现的句子</button>
      <button class="toolbtn" id="p-edit">改释义</button>
    </div>
  </div>
</div>

<script src="app.js?v=20261014y"></script>   <!-- 每次改完前端记得把 v 往后推一位，否则手机会被 Pages 的 10 分钟缓存挡住 -->
</body>
</html>
