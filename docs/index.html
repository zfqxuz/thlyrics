<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TH Lyrics</title>
<!-- 图标：安卓/桌面 PWA 用 manifest，浏览器用 favicon（顺手修掉之前 favicon 404 的控制台报错） -->
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#A52628">
<style>
/* ── 字体 ── */
/* 衬线（标题/封面感）：优先 Hiragino Mincho / 思源宋 / 游明朝；中文 fallback 到 宋体/PingFang */
:root{
  --serif: "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Noto Serif JP", "Source Han Serif SC", "Songti SC", "STSong", "FangSong", "STZhongsong", serif;
  --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}

/* ── Dark 主题（夜读：夜墨 + 纸白 + 柔朱）── */
:root{
  --bg:        #171a1f;     /* 夜墨 */
  --bg-2:      #1c1f26;     /* 略提 */
  --surface:   #222833;     /* 卡片/浮层：比 bg 明显一档 */
  --surface-2: #2b323e;     /* 再高一层 */
  --line:      rgba(237,229,210,.10);
  --hairline:  rgba(237,229,210,.06);
  --ink:       #ede5d2;     /* 纸白（带暖） */
  --ink-2:     #a8a294;     /* 灰墨 */
  --ink-3:     #6f6a5e;     /* 淡墨 */
  --ink-mute:  #4d4a44;
  --paper:     #f4ecd8;     /* 强对比点缀 */
  --accent:    #e0826a;     /* 柔朱 */
  --accent-2:  #c66e58;     /* 深一档 hover */
  --accent-soft: rgba(224,130,106,.14);
  --accent-ink: #f5b09c;
  --accent-ink-2: #e0826a;
  --moss:      #a8b584;     /* 苔色 */
  --star:      #e3c069;     /* 山吹（星标）*/ 
  --star-soft: rgba(227,192,105,.14);
  --moss-soft: rgba(168,181,132,.16);
  --ok:        #94c79a;
  --ok-soft:   rgba(148,199,154,.12);
  --ok-ink:    #b8d9bd;
  --danger:    #e0826a;
  --danger-soft: rgba(224,130,106,.12);

  /* 词性色 */
  --p-n:    #84b6e8;    /* 名：浅空 */
  --p-v:    #e89c78;    /* 动：柔朱 */
  --p-a:    #e8c878;    /* 形：暖 */
  --p-na:   #d4a572;    /* 形动： */
  --p-adv:  #b8a4e0;    /* 副：浅堇 */
  --p-prt:  #8c93a4;    /* 助：灰 */
  --p-aux:  #7a8090;
  --p-oth:  #9aa0ac;

  /* 字号 */
  --fs-hero: 26px;
  --fs-title: 18px;
  --fs-lyric: 24px;
  --fs-body: 15px;
  --fs-sub:  13px;
  --fs-meta: 11.5px;

  /* 间距 */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 36px;

  /* 状态 */
  --hov: rgba(237,229,210,.04);
  --press: rgba(237,229,210,.07);
  --track: rgba(237,229,210,.10);
  --bar:   rgba(237,229,210,.10);
  --grab:  rgba(237,229,210,.20);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.18);
  --shadow:    0 -10px 32px rgba(0,0,0,.55);
  --shadow-lg: 0 14px 40px rgba(0,0,0,.58);

  --sheetline: rgba(237,229,210,.08);
  --layer-line: rgba(237,229,210,.14);
  --radius: 14px;
  --radius-lg: 18px;
  --radius-xl: 22px;
}

/* ── Warm 主题（旧纸 + 墨色 + 朱红 + 苔色）── */
body.warm{
  --bg:        #fbf7ee;     /* 旧纸 */
  --bg-2:      #f4eedf;     /* 略深 */
  --surface:   #fffefa;     /* 米白（卡片/浮层） */
  --surface-2: #f4eedf;     /* 浅一档 */
  --line:      rgba(74,58,42,.10);
  --hairline:  rgba(74,58,42,.05);
  --ink:       #3a302a;     /* 墨 */
  --ink-2:     #756a5d;     /* 灰墨 */
  --ink-3:     #9d9182;     /* 淡墨 */
  --ink-mute:  #c0b6a6;
  --paper:     #3a302a;
  --accent:    #b54a3b;     /* 柔朱 */
  --accent-2:  #9a3a2d;
  --accent-soft: rgba(181,74,59,.10);
  --accent-ink: #b54a3b;
  --accent-ink-2: #9a3a2d;
  --moss:      #7c8a5a;
  --star:      #c09a3e;     /* 山吹（星标）*/
  --star-soft: rgba(192,154,62,.13);
  --moss-soft: rgba(124,138,90,.14);
  --ok:        #5a8a64;
  --ok-soft:   rgba(90,138,100,.12);
  --ok-ink:    #3e6b4f;
  --danger:    #b54a3b;
  --danger-soft: rgba(181,74,59,.10);

  --p-n:    #2e6aa0;
  --p-v:    #a8401f;
  --p-a:    #8a6a18;
  --p-na:   #9a5818;
  --p-adv:  #6449ab;
  --p-prt:  #6e6458;
  --p-aux:  #6e6458;
  --p-oth:  #807a72;

  --hov: rgba(74,58,42,.04);
  --press: rgba(74,58,42,.08);
  --track: rgba(74,58,42,.10);
  --bar:   rgba(74,58,42,.10);
  --field: #ebe2cd;     /* 输入框底色 */
  --grab:  rgba(74,58,42,.18);
  --shadow-sm: 0 1px 3px rgba(74,58,42,.10);
  --shadow:    0 -10px 30px rgba(74,58,42,.22);
  --shadow-lg: 0 14px 36px rgba(74,58,42,.22);

  --sheetline: rgba(74,58,42,.10);
  --layer-line: rgba(74,58,42,.14);   /* 浮层描边：比 hairline 清楚一档 */
}

/* ── 基础 ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
.ic{width:1em;height:1em;display:block;flex:0 0 auto;pointer-events:none}
.ic.in{display:inline-block;vertical-align:-.14em;width:1.05em;height:1.05em}
.ic.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  font-feature-settings:"palt";
  text-rendering:optimizeLegibility;
  transition:background-color .25s ease,color .25s ease;
}
body.warm{background:var(--bg);color:var(--ink)}

a{color:var(--ink-2);text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;color:inherit}

.serif{font-family:var(--serif);font-weight:600;letter-spacing:.02em}
.tlink{color:var(--accent);font-weight:500;padding:0;background:none}
.tlink:hover{color:var(--accent-2)}
.tlink-ghost{color:var(--ink-2)}
.tlink-ghost:hover{color:var(--ink)}

.wrap{max-width:720px;margin:0 auto}

/* ── 顶栏（带 backdrop-blur 的半透明纸）── */
.topbar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(14px + env(safe-area-inset-top, 0px)) 18px calc(14px - 2px);   /* App 状态栏吃掉上面 14px */
  background:rgba(0,0,0,0);             /* 用伪元素做 blur，主体可继承色 */
  border:0;
}
body.warm .topbar{background:rgba(251,247,238,.72)}
body:not(.warm) .topbar{background:rgba(23,26,31,.72)}
.topbar::after{
  content:"";position:absolute;inset:0;z-index:-1;
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
}
.brand{
  font-size:15px;font-weight:600;letter-spacing:.02em;
  display:flex;align-items:baseline;gap:9px;
  min-width:0;overflow:hidden;white-space:nowrap;flex-wrap:nowrap;
}
.brand .b1{
  font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.04em;
  white-space:nowrap;flex:0 0 auto;
}
.brand .b2{
  font-family:var(--serif);font-size:10.5px;color:var(--ink-3);font-weight:400;letter-spacing:.10em;
  white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;
}
.brand small{
  color:var(--ink-3);font-weight:400;font-size:11px;
  white-space:nowrap;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;
  padding-left:9px;border-left:1px solid var(--hairline);line-height:1.2;
}
/* 窄屏：装饰性的日文副标让位，别把「TH Lyrics」和曲库计数挤成两行 */
@media (max-width:440px){ .brand .b2{display:none} }
@media (max-width:340px){ #headstat{display:none} }

/* 顶栏图标按钮：去掉边框，纯图标 + press 极浅底色 */
.iconbtn{
  width:36px;height:36px;flex:0 0 auto;border-radius:50%;
  border:0;background:transparent;color:var(--ink-2);
  display:grid;place-items:center;font-size:16px;
  transition:background-color .15s ease,color .15s ease,transform .12s ease;
}
.iconbtn:hover{background:var(--hov);color:var(--ink)}
.iconbtn:active{transform:scale(.92);background:var(--press)}

/* ── 搜索：常驻一条，图标在输入框里（不再有单独的搜索按钮） ── */
.searchwrap{padding:4px 18px 6px}
.searchbox{position:relative}
.searchbox .sicon{
  position:absolute;left:14px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--ink-3);pointer-events:none;
}
.searchbox input{
  width:100%;height:42px;padding:0 38px 0 38px;
  border-radius:21px;border:0;
  background:var(--field);color:var(--ink);
  font-size:14px;outline:none;
  transition:background-color .15s;
}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox input:focus{background:var(--surface-2)}
.searchbox .clr{
  position:absolute;right:4px;top:4px;width:32px;height:32px;border-radius:50%;
  color:var(--ink-3);display:grid;place-items:center;
}
.searchbox .clr:hover{background:var(--hov);color:var(--ink)}

/* ── Tabs：纯文字 + active 下划线 ── */
.segs{display:flex;gap:0;padding:8px 18px 6px;background:transparent}
.segs button{
  flex:1;height:34px;border:0;background:transparent;color:var(--ink-3);
  font-size:13px;font-weight:500;letter-spacing:.04em;
  position:relative;
  transition:color .18s ease;
}
.segs button:hover{color:var(--ink-2)}
.segs button.on{color:var(--ink);font-weight:600}
.segs button.on::after{
  content:"";position:absolute;left:50%;bottom:2px;width:18px;height:2px;
  background:var(--accent);border-radius:2px;
  transform:translateX(-50%);
}

main{padding:8px 18px 140px}

/* ── 通用排版 ── */
.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-3);margin:var(--sp-3) 0 var(--sp-1)}
.sec-title{font-size:var(--fs-title);font-weight:600;letter-spacing:.02em;font-family:var(--serif)}
.sec-sub{font-size:var(--fs-meta);color:var(--ink-3);margin-top:4px;letter-spacing:.02em}
.bar{height:2px;border-radius:2px;background:var(--track);overflow:hidden;margin-top:10px}
.learn-head{margin-top:8px;margin-bottom:14px;display:block}
.learn-title{font-size:22px;font-weight:600;color:var(--ink);letter-spacing:.02em;line-height:1.4}
.learn-title .accent{color:var(--accent);font-weight:700}
.learn-sub{font-size:12px;color:var(--ink-3);margin-top:6px;letter-spacing:.04em}
.learn-bar{margin:14px 0 18px}
.learn-filters{margin:8px 0 18px;display:flex;flex-direction:column;gap:14px}
.learn-filter-row{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
.filter-label{font-size:11px;color:var(--ink-3);letter-spacing:.18em;font-family:var(--serif);flex:0 0 32px;padding-top:6px;text-align:left}
.learn-filter-row .chips{margin:0;flex:1;min-width:0}
.learn-filter-row .chip{margin-right:12px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:2px;transition:width .3s}
.hair{height:1px;background:var(--line);margin:var(--sp-5) 0;border:0}
.hint{font-size:11.5px;color:var(--ink-3);margin-top:10px;line-height:1.7}
.empty{padding:44px 8px;text-align:center;color:var(--ink-3);font-size:13px}

/* ── 列表行：分隔线更细；间距即"分群" ── */
.list{display:flex;flex-direction:column;gap:2px}
.item{
  display:flex;align-items:center;gap:14px;padding:13px 0;
  border:0;border-bottom:1px solid var(--hairline);
  cursor:pointer;transition:opacity .15s ease;
}
.item:last-child{border-bottom:0}
.item:active{opacity:.6}
.col{flex:1;min-width:0}
.l1{font-size:var(--fs-body);font-weight:600;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l1 .rd{font-size:12px;font-weight:400;color:var(--ink-2);margin-left:7px}
.l2{font-size:var(--fs-sub);color:var(--ink-2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l3{font-size:var(--fs-meta);color:var(--ink-3);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{font-size:9px;letter-spacing:2px;color:var(--ink-3);white-space:nowrap}
.dots b{color:var(--accent);font-weight:400}
.tick{
  width:32px;height:32px;border-radius:50%;border:0;color:var(--ink-3);
  font-size:13px;display:grid;place-items:center;
  transition:background-color .15s,color .15s;
}
.tick:hover{background:var(--hov);color:var(--ink-2)}
.tick.on{color:var(--ok);background:var(--ok-soft)}
.tick.del{color:var(--danger)}
.tick.del:hover{background:var(--danger-soft)}

/* ── 导入网易云 ── */
.impbox{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 var(--sp-4);margin:var(--sp-2) 0 var(--sp-4);background:transparent}
.impbox summary{font-size:13px;color:var(--ink-2);cursor:pointer;list-style:none;font-family:var(--serif)}
.impbox summary::-webkit-details-marker{display:none}
.impbox summary::before{content:'＋ ';color:var(--ink-3);font-family:var(--sans)}
.impbox[open] summary::before{content:'－ '}
.impbox .sel{background:var(--surface-2)}
.implog{margin-top:10px;max-height:240px;overflow:auto}
.improw{display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:5px 0;border-bottom:1px solid var(--hairline);color:var(--ink-2)}
.improw:last-child{border-bottom:0}
.improw b{font-weight:500;color:var(--ink);flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.improw span{color:var(--ink-3);font-size:11.5px;margin-left:auto;flex:0 0 auto}
.improw.bad span{color:var(--danger)}
.improw.ok span{color:var(--ok)}

.segtext{display:flex;gap:0;font-size:12.5px}
.segtext button{padding:4px 0;margin-right:14px;border-radius:0;background:transparent;color:var(--ink-3);font-family:var(--serif);position:relative}
.segtext button.on{color:var(--ink);font-weight:600}
.segtext button.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent)}

/* ── 分组 ── */
.grp{padding:8px 0 14px;border-bottom:1px solid var(--hairline)}
.grp>summary{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 0;font-size:13px;font-weight:600;cursor:pointer;list-style:none;
  font-family:var(--serif);color:var(--ink);
}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary::after{content:'▾';color:var(--ink-3);font-size:10px;margin-left:6px;font-family:var(--sans)}
.grp[open]>summary::after{content:'▴'}
.grp>summary .meta{flex:1;text-align:right;font-weight:400;color:var(--ink-3);font-family:var(--sans);font-size:11.5px}
.grp .list{padding-left:0;border-left:0;margin-bottom:6px}
.mini{width:32px;height:32px;border-radius:50%;border:0;color:var(--ink-3);font-size:12px;display:grid;place-items:center}
.mini:hover{background:var(--hov);color:var(--ink-2)}

/* 封面 */
.cover{width:46px;height:46px;border-radius:12px;object-fit:cover;background:var(--surface-2);flex:0 0 auto;box-shadow:var(--shadow-sm)}
.cover.big{width:60px;height:60px;border-radius:14px}
.cover.xl{width:72px;height:72px;border-radius:16px;box-shadow:var(--shadow-sm)}

/* 单曲页头部：扉页 + 三动作行 */
.track-head{padding:12px 0 18px;border:0;border-bottom:1px solid var(--hairline);margin-bottom:14px}
.track-back{margin:0 0 10px}
.track-back .tlink{font-size:12.5px;font-family:var(--serif)}
.track-meta{display:flex;align-items:center;gap:14px}
.track-title{font-size:22px;font-weight:600;letter-spacing:.02em;color:var(--ink);line-height:1.35}
.track-artist{font-size:13px;color:var(--ink-2);margin-top:5px}
.track-base{font-size:11.5px;color:var(--ink-3);margin-top:4px;letter-spacing:.02em}
.seprow{display:flex;align-items:center;gap:10px;margin:14px 0 2px;flex-wrap:wrap}
.seprow .k{font-size:12.5px;color:var(--ink-3);letter-spacing:.06em}
.seprow .meta{margin-left:auto}
.track-actions{display:flex;gap:18px;margin-top:16px;flex-wrap:wrap}
.track-actions .tlink{font-family:var(--serif);font-size:13px;padding:0}
.track-actions #t-sing{color:var(--accent);font-weight:600;font-size:14px}
.track-actions #t-sing::after{content:"";display:block;height:1px;background:var(--accent);margin-top:3px;width:24px}

/* ── chips：去边框 + 文字色差 + active 文字下划线 ── */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 6px}
.filtrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.filtrow>*{flex:1 1 44%}
.chip{
  height:26px;padding:0 2px;border-radius:0;border:0;background:transparent;
  color:var(--ink-3);font-size:12.5px;display:inline-flex;align-items:center;
  margin-right:14px;position:relative;
}
.chip:last-child{margin-right:0}
.chip.on{color:var(--ink);font-weight:600}
.chip.on::after{content:"";position:absolute;left:2px;right:2px;bottom:-2px;height:1px;background:var(--accent)}
.sel{height:34px;padding:0 10px;border-radius:11px;border:0;background:var(--field);color:var(--ink-2);font-size:var(--fs-sub)}
.toolbtn{
  height:34px;padding:0 14px;border-radius:11px;border:0;
  background:var(--surface);color:var(--ink-2);font-size:var(--fs-sub);
  transition:background-color .15s,color .15s;
}
.toolbtn:hover{background:var(--hov);color:var(--ink)}
.toolbtn.on{background:var(--accent-soft);color:var(--accent-ink)}

#gate{position:fixed;inset:0;z-index:99;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:18px}
#gate[hidden]{display:none}
.gatecard{
  width:100%;max-width:340px;
  background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-lg);
  padding:24px 22px;display:flex;flex-direction:column;gap:12px;
  box-shadow:var(--shadow-lg);
}
.gatecard .gtitle{font-size:22px;font-family:var(--serif);color:var(--ink);font-weight:600;letter-spacing:.02em}
.gatecard .gsub{font-size:12.5px;color:var(--ink-2);line-height:1.7}
.gatecard .sel{height:42px;border-radius:12px;border:0;background:var(--field);color:var(--ink);padding:0 12px;font-size:14px}
.gatecard .row{display:flex;gap:8px}
.gatecard .row button{flex:1}
.gatecard .gmsg{font-size:12px;color:var(--accent-ink);min-height:16px}
.gclose{position:absolute;right:10px;top:8px;width:32px;height:32px;border:0;background:transparent;color:var(--ink-3);font-size:22px;line-height:1;cursor:pointer}
.gcode{margin-top:14px;padding:14px 12px;border-radius:12px;background:var(--field);color:var(--ink);font-family:var(--mono);font-size:18px;letter-spacing:.08em;text-align:center;word-break:break-all}
.gcheck{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--ink-2)}
.gcheck input{width:16px;height:16px;accent-color:var(--accent)}
#dlg .dlga .btn-main:disabled{opacity:.45;cursor:default}
.picklist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.pickitem{height:42px;border:0;border-radius:11px;background:var(--field);color:var(--ink-2);font-size:13px;text-align:left;padding:0 14px}
.pickitem.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}

.accbox{margin:var(--sp-4) 0 var(--sp-2);padding:0 0 var(--sp-4);border-bottom:1px solid var(--line)}
.accbox.on{border-bottom-color:var(--accent)}
.accbox .l1{font-size:14px;color:var(--ink);font-family:var(--serif)}
.accbox .l2{font-size:12px;color:var(--ink-2);line-height:1.7;margin-top:3px}
.accbox .sel{height:36px;border-radius:11px;border:0;background:var(--field);color:var(--ink);padding:0 10px;font-size:13px}

/* ── 按钮三档 ── 文字化为主，主按钮用左色块强调而不是"实心按钮" */
.btn-main{
  height:42px;padding:0 18px;border-radius:11px;border:0;
  background:var(--accent);color:var(--paper);font-weight:600;font-size:14px;
  transition:background-color .15s,transform .12s;
}
body.warm .btn-main{color:#fff8ec}
.btn-main:hover{background:var(--accent-2)}
.btn-main:active{transform:scale(.97)}
.btn-ghost{
  height:38px;padding:0 14px;border-radius:11px;border:0;
  color:var(--ink-2);font-size:13px;background:transparent;
}
.btn-ghost:hover{background:var(--hov);color:var(--ink)}
.btn-danger{
  height:32px;padding:0 12px;border-radius:11px;border:0;
  color:var(--accent-ink-2);font-size:11.5px;background:transparent;
}
.btn-danger:hover{background:var(--accent-soft)}
.btn-primary{                 /* 兼容旧名字 */
  height:40px;padding:0 18px;border-radius:12px;border:0;
  background:var(--accent);color:#fff8ec;font-weight:600;font-size:14px;
  transition:background-color .15s;
}
.btn-primary:hover{background:var(--accent-2)}

/* ── 分段标题 ── */
.srhead{font-size:11px;color:var(--ink-3);letter-spacing:.18em;margin:var(--sp-5) 0 var(--sp-2);font-family:var(--serif)}
.srhead b{color:var(--ink-2);font-weight:500;letter-spacing:0}

/* ── 复习卡 ── */
.revwrap{max-width:520px;margin:0 auto}
.revcard{padding:var(--sp-6) var(--sp-3);text-align:center;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:var(--sp-2)}
.revcard .rw{font-size:38px;font-weight:600;letter-spacing:.04em;font-family:var(--serif);color:var(--ink)}
.revcard .rr{font-size:13px;color:var(--ink-2);font-family:var(--mono)}
.revcard .rm{font-size:18px;color:var(--ink);margin-top:8px;font-family:var(--serif)}
.revcard .rx{font-size:13px;color:var(--ink-2);line-height:1.8}
.revbar{height:2px;border-radius:2px;background:var(--bar);overflow:hidden;margin:16px 0}
.revbar i{display:block;height:100%;background:var(--accent)}
.revacts{display:flex;gap:12px;margin-top:18px}
.revacts button{
  flex:1;height:48px;border-radius:12px;border:0;
  background:transparent;color:var(--ink-2);font-size:14px;
  transition:background-color .15s,color .15s;
}
.revacts button:hover{background:var(--hov);color:var(--ink)}
.revacts button.k{background:var(--accent);color:#fff8ec;font-weight:600}
.revacts button.k:hover{background:var(--accent-2)}

/* ── 空状态 ── */
.emptybox{padding:48px var(--sp-3);text-align:center}
.emptybox .et{font-size:18px;color:var(--ink);font-family:var(--serif);font-weight:600;letter-spacing:.02em}
.emptybox .es{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.8}
.emptybox .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* ── 首页：扉页感 ── */
.herohead{
  padding:28px 0 22px;margin:0;
  border:0;
  background:transparent;
}
.herohead .ht{
  font-family:var(--serif);font-size:26px;line-height:1.34;font-weight:600;
  color:var(--ink);letter-spacing:.02em;
}
@media (max-width:380px){ .herohead .ht{font-size:23px} }
.herohead .ht .accent{color:var(--accent)}
.herohead .ht .sep{display:inline-block;width:6px;height:6px;background:var(--accent);border-radius:50%;margin:0 4px 4px;vertical-align:middle}
.herohead .hs{font-size:13px;color:var(--ink-2);margin-top:12px;line-height:1.7}
/* 「曲库 · 学词 · 生词本」改成轻链接列 */
.herohead .hln{display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.herohead .hln button{
  font-size:13px;color:var(--ink-2);background:transparent;border:0;padding:0;
  font-family:var(--serif);position:relative;
}
.herohead .hln button:hover{color:var(--ink)}
.herohead .hln button .cnt{color:var(--ink-3);font-family:var(--sans);font-size:11.5px;margin-left:4px}
.herohead .hln button.on{color:var(--ink);font-weight:600}
.herohead .hln button.on::after{content:"";position:absolute;left:0;right:18px;bottom:-4px;height:1px;background:var(--accent)}

/* ── "现在"卡片：横线进度 + 一行状态 ── */
.nowcard{padding:18px 0 14px;border:0;margin:0}
.nowcard .k{font-size:11px;color:var(--ink-3);letter-spacing:.18em;font-family:var(--serif)}
.nowcard .t{font-size:18px;font-weight:600;margin-top:6px;font-family:var(--serif);color:var(--ink)}
.nowcard .a{font-size:12.5px;color:var(--ink-2);margin-top:4px;line-height:1.6}
.nowcard .acts{display:flex;gap:14px;margin-top:14px;align-items:center}
.wordstrip{display:flex;gap:0;overflow-x:auto;padding:8px 0 6px;-webkit-overflow-scrolling:touch;margin:0 -18px;padding-left:18px;padding-right:18px}
.wordstrip button{
  flex:0 0 auto;height:32px;padding:0 14px;margin-right:8px;
  border-radius:16px;border:0;background:transparent;color:var(--ink);
  font-size:14px;font-family:var(--serif);
  transition:background-color .15s;
}
.wordstrip button:hover{background:var(--hov)}
.wordstrip button span{color:var(--ink-3);font-family:var(--sans);font-size:11.5px;margin-left:4px}

/* ── 显示抽屉：纯文字开关 ── */
#displaybox{
  position:absolute;right:12px;bottom:calc(100% + 12px);z-index:5;
  display:none;min-width:240px;padding:14px 16px;border-radius:14px;
  border:1px solid var(--layer-line);background:var(--surface);
  box-shadow:var(--shadow-lg);
}
#displaybox.on{display:block}
#displaybox .dr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;font-size:13px}
#displaybox .dr+hr{display:none}
#displaybox .dr button{
  height:26px;padding:0 0;border-radius:0;border:0;
  color:var(--ink-3);font-size:12.5px;font-family:var(--serif);background:transparent;
}
#displaybox .dr button.on{color:var(--accent);font-weight:600;position:relative}
#displaybox .dr button.on::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:1px;background:var(--accent)}

/* ── 歌词 ── */
.lblock{
  padding:10px 0 11px;border-radius:0;margin:0;
  border-bottom:1px solid var(--hairline);
  cursor:pointer;position:relative;
  transition:background-color .2s ease;
}
.lblock:last-child{border-bottom:0}
.lblock:active{background:var(--hov)}
.lblock.playing{background:var(--accent-soft)}
.line{font-size:18px;line-height:1.9;letter-spacing:.01em;min-height:2em;display:block;font-family:var(--sans)}
.line.en{color:var(--ink-2);font-size:15px}
.romaji{font-size:11px;color:var(--ink-3);font-family:var(--mono);margin-top:6px;letter-spacing:.04em}
.lblock .zh{
  font-size:13px;color:var(--ink-2);margin-top:6px;padding-left:10px;
  border-left:2px solid var(--accent-soft);
}
.space{height:14px}
.line .w{cursor:pointer;border-radius:4px;padding:0 1px;transition:background-color .12s}
.line .w:active{background:var(--press)}
.line .w.k-n{color:var(--p-n)} .line .w.k-v{color:var(--p-v)} .line .w.k-a{color:var(--p-a)}
.line .w.k-na{color:var(--p-na)} .line .w.k-adv{color:var(--p-adv)}
.line .w.k-prt,.line .w.k-aux{color:var(--p-prt)}
.line .w.k-conj,.line .w.k-int,.line .w.k-rent,.line .w.k-pref,.line .w.k-oth{color:var(--p-oth)}
.line .w.known{opacity:.5}
.line .g{display:none}
.line .r{display:none}
body.ruby .line .w{
  display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;
  text-align:center;max-width:12em;margin:0 1px;line-height:1.35;
}
body.ruby .line .r{
  display:block;min-height:1.3em;font-size:10px;line-height:1.3;color:var(--ink-3);
  font-family:var(--mono);font-weight:400;white-space:nowrap;letter-spacing:.02em;
}
body.gloss .line .w{
  display:inline-flex;flex-direction:column;align-items:center;vertical-align:top;
  text-align:center;max-width:9.5em;
}
body.gloss .line .g{display:block;font-size:9.5px;line-height:1.25;color:var(--ink-3);font-weight:400;white-space:normal;padding:0 2px}
.line .w[data-fixed="1"] .r{color:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;color:var(--ink-3);margin:4px 0 12px;font-family:var(--serif);letter-spacing:.04em}
.legend i{font-style:normal;margin-right:5px}

/* ── 迷你播放条：细线浮条 ── */
#minibar{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  transform:translateY(120%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s;
  padding:0 14px calc(10px + env(safe-area-inset-bottom));
  opacity:0;
}
#minibar.on{transform:none;opacity:1}
#minibar .mbprog{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--bar);overflow:hidden}
#minibar .mbprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s linear}
#minibar .inner{
  max-width:720px;margin:0 auto;
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  border-radius:16px;
  background:var(--surface);
  border:1px solid var(--layer-line);
  box-shadow:var(--shadow-lg);
}
#minibar .meta{flex:1;min-width:0;cursor:pointer}
#minibar .t1{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif)}
#minibar .t2{font-size:10.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
#playbtn{
  width:38px;height:38px;border-radius:50%;
  background:var(--accent);color:#fff8ec;font-size:15px;
  display:grid;place-items:center;flex:0 0 auto;
  transition:transform .12s,background-color .15s;
}
#playbtn:hover{background:var(--accent-2)}
#playbtn:active{transform:scale(.94)}
.loading #playbtn{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

/* ── 全屏跟唱页 ── */
#player{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  display:flex;flex-direction:column;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .2s;
  visibility:hidden;
}
#player.on{transform:none;visibility:visible}

#player .phead{
  display:flex;align-items:center;gap:12px;
  padding:14px 18px 12px;border:0;
  background:transparent;
}
#player .phead .t{flex:1;min-width:0}
#player .phead .pcover{
  width:36px;height:36px;border-radius:9px;object-fit:cover;flex:0 0 auto;
  background:var(--surface-2);box-shadow:var(--shadow-sm);
}
#player .phead .a{font-size:14px;font-weight:600;font-family:var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .phead .b{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
#player .plytoggles{display:flex;gap:6px;padding:6px 18px 0}
#player .plytoggles .chip{font-size:12px}
#player .pstate{
  min-height:17px;padding:6px 18px 0;
  font-size:11.5px;line-height:1.4;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#player .loopexit{
  align-self:flex-start;margin:6px 18px 0;height:26px;padding:0 10px;border-radius:999px;border:0;
  background:var(--accent-soft);color:var(--accent-ink);font-size:11.5px;
}
#player .loopexit[hidden]{display:none}
#player .plyrics{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:14px 18px 24px;
  -webkit-overflow-scrolling:touch;
  scroll-padding-bottom:24px;
}
.w.w-flash{background:var(--accent-soft);border-radius:4px}
#player .pctl{
  flex:0 0 auto;position:relative;
  border:0;
  padding:10px 18px calc(14px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,0);
}
body.warm #player .pctl{background:rgba(251,247,238,.85)}
body:not(.warm) #player .pctl{background:rgba(23,26,31,.85)}
#player .pctl::before{
  content:"";position:absolute;inset:0;z-index:-1;
  -webkit-backdrop-filter:blur(14px) saturate(160%);
  backdrop-filter:blur(14px) saturate(160%);
}
#player .ctlrow{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
#player .ctlrow #b-display{margin-left:auto}
#player .seekrow{display:flex;align-items:center;gap:10px}
#player input[type=range]{flex:1;min-width:0;height:26px;accent-color:var(--accent)}
#player .time{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums;min-width:38px;text-align:center}
#player .btnrow{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:6px}
#player .navbtn{height:38px;min-width:auto;padding:0 4px;justify-content:center;background:transparent;border:0;color:var(--ink-2);font-size:13px;font-family:var(--serif);font-weight:500}
#player .navbtn:hover{color:var(--ink);background:transparent}
#player .navbtn:active{opacity:.6}
#player .round{
  width:38px;height:38px;border-radius:50%;border:0;color:var(--ink-2);
  display:grid;place-items:center;font-size:14px;
  transition:background-color .15s,color .15s;
}
#player .round:hover{background:var(--hov);color:var(--ink)}
#player .round.on{color:var(--accent);background:var(--accent-soft)}
#player .big{
  width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff8ec;font-size:20px;
  display:grid;place-items:center;box-shadow:var(--shadow-sm);
}
#player .big:active{transform:scale(.95)}

/* 单句/全曲 / 顺序 / 显示设置：全部退化成文字下划线链接 */
.modeseg{
  display:inline-flex;gap:0;background:transparent;
  padding:0;border:0;flex:0 0 auto;
}
.modeseg button{
  height:28px;padding:0 12px;border:0;background:transparent;
  font-size:12px;color:var(--ink-3);font-family:var(--serif);
}
.modeseg button.on{color:var(--ink);font-weight:600;position:relative}
.modeseg button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:1px;background:var(--accent)}

/* 全曲 / 单句：纯文字 + 中间竖线 */
.scope2{
  display:inline-flex;align-items:stretch;gap:0;padding:0;
  background:transparent;border:0;flex:0 0 auto;
  font-family:var(--serif);
}
.scope2 .half{
  height:30px;padding:0 12px;border:0;border-radius:0;
  background:transparent;font-size:13px;color:var(--ink-3);
  position:relative;transition:color .18s;
}
.scope2 .half:first-child{padding-left:0}
.scope2 .half + .half{border-left:1px solid var(--hairline)}
.scope2 .half.on{color:var(--ink);font-weight:600}
.scope2 .half.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-2px;height:1px;background:var(--accent)}
.scope2 .half:first-child.on::after{left:0}

/* 倍速/顺序/更多按钮：pill 化变文字按钮 */
.chipcycle{
  height:32px;padding:0 4px;border:0;background:transparent;
  color:var(--ink-2);font-size:12.5px;
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  font-family:var(--serif);position:relative;
}
.chipcycle .ic{font-size:13px;line-height:1;color:var(--ink-3)}
.chipcycle.on{color:var(--ink)}
.chipcycle.on::after{content:"";position:absolute;left:4px;right:4px;bottom:-1px;height:1px;background:var(--accent)}
.chipcycle.on .ic{color:var(--ink)}
.chipcycle.off{opacity:.38}
.chipcycle.pend::after{content:"";position:absolute;left:4px;right:4px;bottom:-1px;height:1px;background:var(--accent);opacity:.5;animation:sepPulse 1.2s ease-in-out infinite}
@keyframes sepPulse{0%,100%{opacity:.15}50%{opacity:.8}}

.modechip{
  height:28px;padding:0 0;border:0;background:transparent;color:var(--ink-2);
  font-size:11.5px;display:inline-flex;align-items:center;gap:6px;
  font-family:var(--serif);position:relative;
}
.modechip.on{color:var(--accent)}
.modechip.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--accent)}

/* 跟唱聚焦：其它句压暗；当前句用「朱红底色 + 左侧竖条 + 字重」三重区分
   （用户反馈过：只改字重/透明度看着「没有颜色区分」） */
#plyric .lblock{transition:opacity .25s,background-color .25s;border-radius:10px}
#plyric.has-active .lblock{opacity:.26}
#plyric.has-active .lblock.playing{
  opacity:1;
  background:var(--accent-soft);
}
#plyric.has-active .lblock.playing::before{
  content:"";position:absolute;left:-8px;top:12px;bottom:12px;width:3px;border-radius:2px;background:var(--accent);
}
#plyric.has-active .lblock.playing .line{font-weight:650;letter-spacing:.01em}
/* 当前句保留词性配色（之前强行刷成墨色 → 看起来「没有颜色区分」），只把亮度拉满 */
#plyric.has-active .lblock.playing .line .w{opacity:1 !important;filter:saturate(1.25)}
#plyric.has-active .lblock.playing .zh{color:var(--ink);border-left-color:var(--accent)}
/* 没有当前句时（没播 / 没时间轴），别把整屏压暗 */
#plyric:not(.has-active) .lblock{opacity:1}

/* ── 词条抽屉：#pop（两阶段：一阶段半屏 / 二阶段 75%）── */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;
  transform:translateY(110%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);
  background:var(--surface);
  border-radius:20px 20px 0 0;
  border:1px solid var(--layer-line);border-bottom:0;
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  max-height:75vh;
}
.sheet.on{transform:none}
.sheet .grab{width:32px;height:3px;border-radius:2px;background:var(--grab);margin:14px auto 10px;flex:0 0 auto}
.sheet .pop-body{
  overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:0 20px 10px;
  max-height:38vh;
  transition:max-height .3s cubic-bezier(.2,.8,.2,1);
}
.sheet.expanded .pop-body{max-height:calc(75vh - 44px)}

/* 底部「上拉看更多」提示：只在收起态出现，箭头上下呼吸 */
.pop-more{
  flex:0 0 auto;height:40px;width:100%;
  display:flex;align-items:center;justify-content:center;gap:6px;
  padding:0;border:0;background:transparent;
  color:var(--ink-3);font-size:11.5px;font-family:var(--serif);letter-spacing:.06em;
  padding-bottom:calc(6px + env(safe-area-inset-bottom));
  transition:opacity .2s;
}
.sheet.expanded .pop-more{display:none}
.sheet.short .pop-more{display:none}
.pop-more .ic.arrow{width:15px;height:15px;animation:nudge 1.5s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-4px);opacity:1}}

/* 词头：左词右图标（发音/已掌握/关闭）—— 不再有链接行 */
#pop .r1{display:flex;align-items:flex-start;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--hairline)}
#pop .r1-l{flex:1;min-width:0;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
#pop .r1-r{flex:0 0 auto;display:flex;align-items:center;gap:2px;margin:-4px -6px 0 0}
#pop .icbtn{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--ink-2);
  display:grid;place-items:center;font-size:18px;transition:background-color .15s,color .15s}
#pop .icbtn:hover{background:var(--hov);color:var(--ink)}
#pop .icbtn.on{color:var(--ok)}
#pop .icbtn svg{stroke-width:2.1}
#pop .icbtn.on{color:var(--ok)}
#pop .w1{font-size:28px;font-weight:600;font-family:var(--serif);color:var(--ink);letter-spacing:.02em}
#pop .w2{font-size:14px;color:var(--ink-2);font-family:var(--serif)}
#pop .w3{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.04em;cursor:pointer}
#pop .w3::after{content:"✎";font-size:11px;margin-left:5px;color:var(--accent);opacity:.95;font-family:var(--sans)}
#pop .mg{font-size:16px;margin-top:12px;color:var(--ink);font-family:var(--serif);line-height:1.6;cursor:pointer}
#pop .mg::after{content:"✎";font-size:12px;margin-left:6px;color:var(--accent);opacity:.95;vertical-align:2px;font-family:var(--sans)}
#pop .mt{font-size:11.5px;color:var(--ink-3);margin-top:6px;letter-spacing:.04em}

/* 「更多」整块：只在展开（二阶段）出现 —— 一阶段保持干净（用户要求：不要按钮也不要例句） */
.pop-more-pane{display:none}
.sheet.expanded .pop-more-pane{display:block}

/* 「更多」里只剩例句，没有链接行 */
#pop input{width:100%;height:38px;padding:0 12px;border-radius:11px;border:0;background:var(--field);color:var(--ink)}
#pop #p-romabox{margin-top:12px;padding-top:12px;border-top:1px solid var(--hairline)}
#pop #p-romabox .meta{margin-bottom:8px}
#pop #p-romacands{margin-bottom:8px;gap:8px}
#pop #p-romabox .row + .row{margin-top:8px}

/* 「出现的句子」区块：直接展示，不再藏在按钮后面 */
#p-more > .pop-sec:first-child{margin-top:14px;padding-top:12px;border-top:1px solid var(--hairline)}
.pop-sec-t{font-size:11px;color:var(--ink-3);letter-spacing:.16em;font-family:var(--serif);margin-bottom:6px}
#p-exlist .list{margin-top:2px}
#p-editrow{margin-top:12px}
#p-romabox{margin-top:12px}
#p-exlist .mt{margin-top:10px}

details.src{border-top:1px solid var(--line);margin-top:18px;padding-top:10px}
details.src summary{font-size:12px;color:var(--ink-3);cursor:pointer;padding:6px 0}
.foot{font-size:10.5px;color:var(--ink-3);text-align:center;margin-top:24px;line-height:1.9;font-family:var(--serif);letter-spacing:.04em}

/* ── 专辑网格 ── */
.albumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.albumcard{cursor:pointer;min-width:0}
.albumcard .cov{
  aspect-ratio:1/1;width:100%;max-width:100%;border-radius:14px;overflow:hidden;
  background:var(--surface-2);
  box-shadow:var(--shadow-sm);
  display:grid;place-items:center;border:0;
}
.albumcard .cov img{width:100%;height:100%;object-fit:cover;display:block}
.albumcard .cov .ph{font-size:24px;color:var(--ink-3);font-family:var(--serif)}
.albumcard .nm{font-size:13px;font-family:var(--serif);font-weight:600;margin-top:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albumcard .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albumcard:active .cov{transform:scale(.99);transition:transform .12s}
@media (max-width:360px){ .albumgrid{gap:10px} .albumcard .nm{font-size:12.5px} }

/* ── 头像 / 头像下拉 / 开关 ── */
.avwrap{position:relative}
.avbtn{
  width:34px;height:34px;border-radius:50%;border:0;background:transparent;
  overflow:hidden;display:grid;place-items:center;
  transition:background-color .15s;
}
.avbtn:hover{background:var(--hov)}
.av{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--ink);background:var(--surface-2);font-family:var(--serif)}
.av.av24{width:24px;height:24px;font-size:11px;flex:0 0 auto}
.av.av48{width:48px;height:48px;font-size:18px;flex:0 0 auto}

.avdrop{
  position:absolute;right:0;top:calc(100% + 10px);z-index:60;
  min-width:200px;background:var(--surface);
  border:1px solid var(--layer-line);border-radius:14px;
  padding:6px;box-shadow:var(--shadow-lg);
}
.avdrop[hidden]{display:none}
.avdrop .mi{
  display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 12px;border-radius:10px;
  font-size:13px;color:var(--ink);text-align:left;
  font-family:var(--serif);
  transition:background-color .15s;
}
.avdrop .mi:hover{background:var(--hov)}
.avdrop .sep{height:1px;background:var(--hairline);margin:6px 4px}

.sw{
  width:36px;height:20px;border-radius:999px;
  background:var(--surface-2);
  border:1px solid var(--hairline);
  position:relative;flex:0 0 auto;transition:.18s;
}
.sw i{
  position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;
  background:var(--ink-3);transition:.18s;
}
.sw.on{background:var(--accent-soft);border-color:var(--accent)}
.sw.on i{left:17px;background:var(--accent)}

.avpick{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.avpick .av{width:38px;height:38px;border:1px dashed var(--ink-3);font-size:14px}

/* ── 我的设置行 ── */
.setrow{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 0;border:0;border-bottom:1px solid var(--hairline);
}
.setrow:last-child{border-bottom:0}
.setrow .k{font-size:14px;font-family:var(--serif)}
.setrow .k small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:400;margin-top:3px;font-family:var(--sans)}
.sect{font-size:11px;color:var(--ink-3);letter-spacing:.18em;margin:var(--sp-5) 0 var(--sp-2);font-family:var(--serif)}

.code{
  width:100%;min-height:80px;border-radius:12px;border:0;
  background:var(--field);color:var(--ink);padding:12px;
  font-size:11.5px;font-family:var(--mono);word-break:break-all;resize:vertical;
}

.marktag{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;font-family:var(--serif)}
.marktag.on{color:var(--accent)}

.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--ink-3)}
.meta{font-size:11.5px;color:var(--ink-3)}

.glogo{width:60px;height:60px;border-radius:18px;display:block;margin:0 auto 14px;box-shadow:var(--shadow-sm);overflow:hidden}

/* ── 例句行内试听 ── */
.exrow{display:flex;align-items:center;gap:10px;padding:9px 0;border:0;border-bottom:1px solid var(--hairline);cursor:pointer}
.exrow:last-child{border-bottom:0}
#p-ex{margin-top:6px}
.exrow .exico{
  width:30px;height:30px;border-radius:50%;border:0;
  display:grid;place-items:center;color:var(--ink-2);flex:0 0 auto;
  background:transparent;
}
.exrow .exico .tri{font-size:11px;line-height:1}
.exrow .exico .eqbars{display:none}
.exrow.on .exico{color:var(--accent);background:var(--accent-soft)}
.exrow.on .exico .tri{display:none}
.exrow.on .exico .eqbars{display:inline-flex}
.exrow.noaudio{opacity:.55}
.exrow.noaudio .exico{color:var(--ink-3)}
.eqbars{display:inline-flex;align-items:flex-end;gap:2px;height:12px}
.eqbars i{display:block;width:2.5px;background:var(--accent);border-radius:1px;animation:eq .8s ease-in-out infinite}
.eqbars i:nth-child(1){height:5px;animation-delay:0s}
.eqbars i:nth-child(2){height:11px;animation-delay:.22s}
.eqbars i:nth-child(3){height:7px;animation-delay:.44s}
@keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}

/* ── 列表里正在播放的那一行 ── */
.item.track.current .l1{color:var(--accent);font-weight:600}
.item.track.current .eqbars{display:inline-flex;margin-left:7px;vertical-align:middle}
.item.track .eqbars{display:none}
.item.track .eqbars i{animation-play-state:paused}
.item.track.playing .eqbars i{animation-play-state:running}
.item.track.current .curbtn{color:var(--accent)}

/* ── 上一首下一首 ── */
#minibar .nbtn{
  width:32px;height:32px;border-radius:50%;border:0;
  color:var(--ink-2);font-size:13px;display:grid;place-items:center;flex:0 0 auto;
  background:transparent;transition:background-color .15s,color .15s;
}
#minibar .nbtn:hover{background:var(--hov);color:var(--ink)}
#player .tracknav{
  width:38px;height:38px;border-radius:50%;border:0;
  color:var(--ink-2);font-size:14px;display:grid;place-items:center;flex:0 0 auto;
  background:transparent;transition:background-color .15s,color .15s;
}
#player .tracknav:hover{background:var(--hov);color:var(--ink)}
@media (max-width:370px){ #player .navbtn{min-width:62px;padding:0 8px;font-size:11.5px} }

/* ── 通用弹窗 ── */
#dlg{
  position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.36);
  display:flex;align-items:center;justify-content:center;padding:18px;
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
}
#dlg[hidden]{display:none}
.dlgcard{
  width:100%;max-width:400px;
  background:var(--surface);border:1px solid var(--layer-line);
  border-radius:18px;padding:22px;
  box-shadow:var(--shadow-lg);
}
.dlgcard .dlgt{font-size:18px;font-family:var(--serif);font-weight:600;letter-spacing:.02em}
.dlgcard .dlgb{font-size:13px;color:var(--ink-2);margin-top:10px;line-height:1.7;word-break:break-word}
.dlgcard .dlga{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlgcard .dlga button{flex:1;min-width:84px;height:42px;padding:0 14px;border-radius:12px;font-size:13px;border:0;background:var(--surface-2);color:var(--ink)}
.dlgcard .dlga .btn-main{flex:1.3;background:var(--accent);color:#fff8ec;font-weight:600}
.dlgcard .dlga .toolbtn{background:var(--surface-2);color:var(--ink-2)}

/* ── 「我的 → 更新」行 ── */
.updrow{
  display:flex;align-items:center;gap:10px;
  padding:12px 0;border:0;border-bottom:1px solid var(--hairline);
}
.updrow:last-child{border-bottom:0}
.updrow .k{flex:1;min-width:0}
.updrow .k b{display:block;font-size:14px;font-weight:600;font-family:var(--serif)}
.updrow .k small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:3px;word-break:break-word;font-family:var(--sans)}



/* ══════════════════════════════════════════════════════════
   星标 ★ / 复习（验证式）/ 学词标签化  ——  本轮新增
   图标全部取自 Lucide v0.468.0 官方，非自绘
   ══════════════════════════════════════════════════════════ */

/* ── 星标按钮：三处共用一套状态 ── */
.star{display:grid;place-items:center;border:0;background:transparent;color:var(--ink-3);
  border-radius:50%;transition:background-color .15s,color .15s;padding:0;cursor:pointer}
.star:hover{background:var(--star-soft);color:var(--star)}
.star.on{color:var(--star);background:var(--star-soft)}
.star svg{stroke-width:2}
.star.on svg{animation:star-pop .18s cubic-bezier(.2,.8,.2,1)}
@keyframes star-pop{0%{transform:scale(1)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.star.on svg{animation:none}}
.star.big{width:38px;height:38px;font-size:20px}
.star.big svg{width:20px;height:20px}
/* 列表行里的星标：和 .tick 同规格，但激活色是山吹不是苔绿 */
.tick.star.on{color:var(--star);background:var(--star-soft)}
/* 抽屉里的星标：跟 .icbtn 同规格 */
#pop .icbtn.star.on{color:var(--star);background:var(--star-soft)}

/* ── 详情页：标题行 + 星标 ── */
.whead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.whead .sec-title{flex:1;min-width:0}
#view-word .word-mean{font-size:17px;margin-top:14px;color:var(--ink)}
/* 列表行上的「已掌握」小标签 */
.wtag{display:inline-block;margin-left:8px;padding:1px 6px;border:1px solid var(--hairline);
  border-radius:5px;font-size:10.5px;font-weight:400;color:var(--ink-3);vertical-align:1px}
.item.word.known .l1{color:var(--ink-2)}
/* 错词右上角的小角标 */
.chip .sup{font-style:normal;font-size:9.5px;margin-left:3px;color:var(--accent-ink);vertical-align:super}

/* ── 学词页：复习巩固条 ── */
.duebar{
  display:flex;align-items:center;gap:10px;margin:0 0 18px;padding:11px 0;
  border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
}
.duebar .t{font-family:var(--serif);font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.duebar .n{font-size:12.5px;color:var(--ink);margin-left:auto}
.duebar .go{padding:0;border:0;background:none;color:var(--accent);font-family:var(--serif);font-size:13px;cursor:pointer}
.duebar .go:hover{color:var(--accent-2)}
.duebar.empty .n{color:var(--ink-3);font-size:12px;margin-left:auto;text-align:right;line-height:1.5}

/* ── 我的词页脚 ── */
.mine-foot{font-size:12px;color:var(--ink-3);padding:12px 0 4px}

/* ── 复习：一屏一题 ── */
.revwrap{max-width:520px;margin:0 auto}
.revtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.revx{padding:0;border:0;background:none;color:var(--ink-3);font-family:var(--serif);font-size:13px;
  display:inline-flex;align-items:center;gap:2px;cursor:pointer}
.revx:hover{color:var(--ink)}
.revx svg{width:15px;height:15px}
.revcount{font-size:11.5px;color:var(--ink-3);font-family:var(--mono);letter-spacing:.06em}
.revbar{height:2px;border-radius:2px;background:var(--bar);overflow:hidden;margin:10px 0 0}
.revbar i{display:block;height:100%;background:var(--accent);transition:width .25s ease}
.revq{padding:34px 4px 22px;text-align:center;min-height:150px;
  display:flex;flex-direction:column;justify-content:center;gap:14px}
.revkind{font-size:11.5px;color:var(--ink-3);letter-spacing:.14em;font-family:var(--serif)}
.revprompt{color:var(--ink)}
.revprompt .rw1{font-family:var(--serif);font-size:38px;font-weight:600;letter-spacing:.04em}
.revprompt .rw2{display:block;font-style:normal;font-size:13px;color:var(--ink-2);margin-top:8px;font-family:var(--serif)}
.revprompt .rw3{font-family:var(--serif);font-size:24px;font-weight:600;line-height:1.5}
.revprompt .rw4{display:block;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1.9;letter-spacing:.02em}
.revprompt .rw4 .blank{color:var(--accent);font-weight:400;letter-spacing:.06em}
.revprompt .rw5{display:block;font-style:normal;font-size:12.5px;color:var(--ink-3);margin-top:8px}
.rwplay{width:72px;height:72px;border-radius:50%;border:1px solid var(--layer-line);background:var(--surface-2);
  color:var(--accent);display:inline-grid;place-items:center;margin:0 auto;cursor:pointer;
  transition:background-color .15s,transform .15s}
.rwplay:hover{background:var(--hov)}
.rwplay:active{transform:scale(.96)}
.rwplay svg{width:30px;height:30px}

/* 选项：整行卡片（学多邻国的"形"，但用我们自己的纸/墨色） */
.revopts{display:flex;flex-direction:column;gap:9px;padding-bottom:8px}
.revopt{
  display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:12px 16px;
  border:1px solid var(--layer-line);border-radius:13px;background:var(--surface);
  color:var(--ink);font-size:16px;font-family:var(--sans);text-align:left;cursor:pointer;
  transition:background-color .15s,border-color .15s,color .15s,opacity .2s;
}
.revopt .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;border:1px solid var(--layer-line);
  display:grid;place-items:center;font-size:11px;color:var(--ink-3);font-family:var(--mono)}
.revopt .t{flex:1;min-width:0}
.revopt:hover{background:var(--hov);border-color:var(--ink-mute)}
.revopt:active{transform:scale(.995)}
.revopt:disabled{cursor:default;transform:none}
.revopt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ink)}
.revopt.right .k{border-color:var(--ok);color:var(--ok-ink)}
.revopt.wrong{border-color:var(--danger);background:var(--danger-soft);color:var(--ink)}
.revopt.wrong .k{border-color:var(--danger);color:var(--danger)}
.revopt.dim{opacity:.4}

/* 底部阻断式反馈条：必须按「继续」才走 */
.revfeed{
  display:flex;align-items:center;gap:10px;margin-top:14px;padding:14px 16px;
  border-radius:13px;border:1px solid var(--layer-line);background:var(--surface-2);
}
.revfeed.ok{border-color:var(--ok);background:var(--ok-soft)}
.revfeed.bad{border-color:var(--danger);background:var(--danger-soft)}
.revfeed .fi{display:grid;place-items:center;color:var(--ink-2)}
.revfeed.ok .fi{color:var(--ok-ink)}
.revfeed.bad .fi{color:var(--danger)}
.revfeed .fi svg{width:20px;height:20px}
.revfeed .fm{flex:1;min-width:0;font-size:14px;color:var(--ink)}
.revfeed .fnext{padding:7px 16px;border:0;border-radius:9px;background:var(--accent);color:#fff8ec;
  font-size:13.5px;font-weight:600;cursor:pointer;font-family:var(--sans)}
.revfeed .fnext:hover{background:var(--accent-2)}

/* 结算 */
.revdone{text-align:center;padding:52px 0 30px}
.revdone .rd-t{font-family:var(--serif);font-size:14px;letter-spacing:.18em;color:var(--ink-3)}
.revdone .rd-big{font-family:var(--serif);font-size:54px;font-weight:600;color:var(--ink);line-height:1.2;margin-top:10px}
.revdone .rd-big span{font-size:22px;color:var(--ink-3)}
.revdone .rd-sub{font-size:12.5px;color:var(--ink-2);margin-top:10px;line-height:1.8}

/* 窄屏：选项字号小一档，别把中文释义挤断 */
@media (max-width:380px){
  .revopt{font-size:15px;padding:11px 13px;min-height:48px}
  .revprompt .rw1{font-size:32px}
  .revprompt .rw4{font-size:17px}
  .revdone .rd-big{font-size:46px}
}

/* ── 读音填空（输入题）── */
.revin{display:flex;gap:9px;padding-bottom:8px}
.revinp{
  flex:1;min-width:0;height:52px;padding:0 16px;border-radius:13px;
  border:0;background:var(--field);color:var(--ink);
  font-size:19px;font-family:var(--serif);letter-spacing:.04em;outline:none;
  transition:background-color .15s;
}
.revinp::placeholder{font-size:13px;letter-spacing:0;color:var(--ink-3);font-family:var(--sans)}
.revinp:focus{background:var(--surface-2)}
.revinp:disabled{opacity:.65}
.revinok{
  flex:0 0 auto;height:52px;padding:0 20px;border:0;border-radius:13px;
  background:var(--accent);color:#fff8ec;font-size:14.5px;font-weight:600;font-family:var(--sans);cursor:pointer;
}
.revinok:hover{background:var(--accent-2)}
.revinok:disabled{opacity:.5;cursor:default}
/* 反馈条里的「读音 · 罗马音」补充信息 */
.revfeed .fa{display:block;font-size:12px;color:var(--ink-3);margin-top:3px;font-family:var(--serif)}

/* ══════════════════════════════════════════════════════════
   UI 2 · iOS / Liquid Glass（v2）
   干净、轻、透明：背景是环境光，内容直接落在背景上；
   只有浮层（tab bar / 迷你条 / sheet / 弹窗 / 播放器控制区）用玻璃。
   不做大色块、不做大按钮、不做整页卡片。
   ══════════════════════════════════════════════════════════ */
.segs .tic{display:none}
.segs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}

/* —— 深色令牌 —— */
body.ui-ios{
  --serif:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --bg:#08080a; --bg-2:#0c0c10;
  --surface:rgba(28,28,32,.48); --surface-2:rgba(44,44,48,.52);
  --glass:rgba(22,22,26,.52); --glass-strong:rgba(20,20,24,.74);
  --glass-line:rgba(255,255,255,.13); --glass-highlight:rgba(255,255,255,.16);
  --line:rgba(255,255,255,.10); --hairline:rgba(255,255,255,.075);
  --ink:#f5f5f7; --ink-2:rgba(235,235,245,.62); --ink-3:rgba(235,235,245,.36); --ink-mute:rgba(235,235,245,.22);
  --paper:#fff;
  --accent:#0a84ff; --accent-2:#409cff;
  --accent-soft:rgba(10,132,255,.13); --accent-ink:#6db6ff; --accent-ink-2:#409cff;
  --moss:#30d158; --star:#ffd60a;
  --star-soft:rgba(255,214,10,.12); --moss-soft:rgba(48,209,88,.11);
  --ok:#30d158; --ok-soft:rgba(48,209,88,.11); --ok-ink:#5be37a;
  --danger:#ff453a; --danger-soft:rgba(255,69,58,.11);
  --p-n:#64d2ff; --p-v:#ff9f0a; --p-a:#ffd60a; --p-na:#ffb340;
  --p-adv:#bf5af2; --p-prt:rgba(235,235,245,.40); --p-aux:rgba(235,235,245,.32); --p-oth:rgba(235,235,245,.48);
  --field:rgba(118,118,128,.14);
  --hov:rgba(255,255,255,.045); --press:rgba(255,255,255,.075);
  --track:rgba(255,255,255,.12); --bar:rgba(255,255,255,.10);
  --grab:rgba(235,235,245,.28);
  --shadow-sm:0 1px 1px rgba(0,0,0,.16);
  --shadow:0 -24px 60px rgba(0,0,0,.40);
  --shadow-lg:0 28px 80px rgba(0,0,0,.46);
  --sheetline:rgba(255,255,255,.11); --layer-line:rgba(255,255,255,.14);
  --radius:12px; --radius-lg:18px; --radius-xl:26px;
  --ios-tabbar-h:54px;
  background-color:#08080a;
  background-image:
    radial-gradient(58% 42% at 88% -4%,rgba(10,132,255,.22),transparent 62%),
    radial-gradient(50% 40% at 8% 22%,rgba(191,90,242,.12),transparent 66%),
    radial-gradient(64% 46% at 48% 104%,rgba(64,156,255,.08),transparent 70%),
    linear-gradient(180deg,#08080a 0%,#0a0a0e 100%);
  background-attachment:fixed;
}
/* —— 浅色令牌 —— */
body.ui-ios.warm{
  --bg:#eef1f6; --bg-2:#e6eaf2;
  --surface:rgba(255,255,255,.58); --surface-2:rgba(255,255,255,.44);
  --glass:rgba(255,255,255,.56); --glass-strong:rgba(255,255,255,.78);
  --glass-line:rgba(255,255,255,.72); --glass-highlight:rgba(255,255,255,.90);
  --line:rgba(60,60,67,.12); --hairline:rgba(60,60,67,.10);
  --ink:#0b0b0f; --ink-2:rgba(60,60,67,.70); --ink-3:rgba(60,60,67,.44); --ink-mute:rgba(60,60,67,.25);
  --paper:#fff;
  --accent:#007aff; --accent-2:#0066d6;
  --accent-soft:rgba(0,122,255,.10); --accent-ink:#007aff; --accent-ink-2:#0066d6;
  --moss:#34c759; --star:#ffcc00;
  --star-soft:rgba(255,204,0,.14); --moss-soft:rgba(52,199,89,.10);
  --ok:#34c759; --ok-soft:rgba(52,199,89,.10); --ok-ink:#248a3d;
  --danger:#ff3b30; --danger-soft:rgba(255,59,48,.09);
  --p-n:#007aff; --p-v:#ff9500; --p-a:#b8860b; --p-na:#c26a00;
  --p-adv:#af52de; --p-prt:rgba(60,60,67,.48); --p-aux:rgba(60,60,67,.40); --p-oth:rgba(60,60,67,.56);
  --field:rgba(118,118,128,.10);
  --hov:rgba(0,0,0,.03); --press:rgba(0,0,0,.055);
  --track:rgba(60,60,67,.14); --bar:rgba(60,60,67,.12);
  --grab:rgba(60,60,67,.22);
  --shadow-sm:0 1px 1px rgba(0,0,0,.035);
  --shadow:0 -24px 60px rgba(0,0,0,.10);
  --shadow-lg:0 28px 80px rgba(0,0,0,.12);
  --sheetline:rgba(60,60,67,.12); --layer-line:rgba(60,60,67,.14);
  background-color:#eef1f6;
  background-image:
    radial-gradient(60% 44% at 88% -4%,rgba(0,122,255,.16),transparent 64%),
    radial-gradient(52% 40% at 6% 22%,rgba(175,82,222,.09),transparent 68%),
    radial-gradient(66% 48% at 48% 104%,rgba(255,255,255,.72),transparent 70%),
    linear-gradient(180deg,#eef1f6 0%,#e9edf4 100%);
}
body.ui-ios,body.ui-ios.warm{font-family:var(--sans);line-height:1.5;color:var(--ink)}
body.ui-ios .wrap{max-width:620px}
body.ui-ios main{padding:8px 18px calc(146px + env(safe-area-inset-bottom))}

/* 顶栏和搜索：只留一层极薄玻璃，不要大色块 */
body.ui-ios .topbar{
  position:sticky;top:0;z-index:40;
  padding:calc(10px + env(safe-area-inset-top,0px)) 18px 4px;
  background:transparent;border:0;
}
body.ui-ios .topbar::after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 82%,transparent) 0%,color-mix(in srgb,var(--bg) 55%,transparent) 62%,transparent 100%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  backdrop-filter:blur(18px) saturate(160%);
}
body.ui-ios .brand{flex-direction:column;align-items:flex-start;gap:0;overflow:visible}
body.ui-ios .brand .b1{font-family:var(--sans);font-size:20px;font-weight:600;letter-spacing:-.035em;line-height:1.2}
body.ui-ios .brand .b2{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;letter-spacing:.01em;color:var(--ink-3);line-height:1.3}
body.ui-ios .brand small{display:block;padding:0;border:0;margin-top:1px;font-size:10.5px;color:var(--ink-3);line-height:1.3}
body.ui-ios .avbtn{
  width:34px;height:34px;border-radius:50%;background:var(--glass);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .av{font-weight:600;background:rgba(255,255,255,.08)}
body.ui-ios.warm .av{background:rgba(255,255,255,.50)}
body.ui-ios .avdrop{
  min-width:210px;padding:6px;border-radius:18px;
  background:var(--glass-strong);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--shadow-lg),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .avdrop .mi{padding:9px 11px;border-radius:11px;font-family:var(--sans);font-size:13.5px;font-weight:400}
body.ui-ios .avdrop .mi:hover{background:var(--hov)}
body.ui-ios .avdrop .sep{background:var(--hairline);margin:4px 8px}

body.ui-ios .searchwrap{padding:2px 18px 8px}
body.ui-ios .searchbox{position:relative}
body.ui-ios .searchbox input{
  height:36px;padding:0 34px 0 34px;border-radius:10px;
  background:var(--glass);border:1px solid var(--glass-line);
  color:var(--ink);font-size:14px;font-weight:400;
  -webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios .searchbox input::placeholder{color:var(--ink-3)}
body.ui-ios .searchbox input:focus{box-shadow:inset 0 1px 0 var(--glass-highlight),0 0 0 2px var(--accent-soft)}
body.ui-ios .searchbox .sicon{left:11px;width:14px;height:14px;color:var(--ink-3)}
body.ui-ios .searchbox .clr{right:1px;top:1px;width:34px;height:34px;color:var(--ink-3)}

/* 底部 tab：薄玻璃条，选中只亮图标和一个小点，不再铺一块蓝 */
body.ui-ios .segs{
  position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));
  z-index:55;transform:translateX(-50%);
  width:min(calc(100% - 32px),420px);height:var(--ios-tabbar-h);
  display:flex;gap:0;padding:5px;background:transparent;border:0;
}
body.ui-ios .segs::before{
  content:"";position:absolute;inset:0;border-radius:21px;z-index:-1;
  background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);
  box-shadow:0 16px 40px rgba(0,0,0,.18),inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios.warm .segs::before{box-shadow:0 16px 40px rgba(34,50,80,.10),inset 0 1px 0 var(--glass-highlight)}
body.ui-ios .segs button{
  position:relative;flex:1;height:44px;border-radius:16px;background:transparent;
  display:flex;flex-direction:column;gap:1px;align-items:center;justify-content:center;
  color:var(--ink-3);font-size:10px;font-weight:500;letter-spacing:0;
  transition:color .18s,background-color .18s;
}
body.ui-ios .segs button .tic{display:block;width:21px;height:21px;stroke-width:1.85}
body.ui-ios .segs button:hover{color:var(--ink-2)}
body.ui-ios .segs button.on{color:var(--accent);background:transparent;font-weight:600}
body.ui-ios .segs button.on::after{
  content:"";position:absolute;left:50%;bottom:2px;width:3px;height:3px;border-radius:50%;
  background:var(--accent);transform:translateX(-50%);
}
body.ui-ios .segs button.on .tic{stroke-width:2.1;filter:drop-shadow(0 0 9px rgba(10,132,255,.38))}

/* 标题：大标题但不粗不黑 */
body.ui-ios .sec-head{align-items:center;margin:14px 2px 10px}
body.ui-ios .sec-title{font-family:var(--sans);font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.18}
body.ui-ios .sec-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px;letter-spacing:0;line-height:1.45}
body.ui-ios .learn-head{margin:16px 2px 8px}
body.ui-ios .learn-title{font-family:var(--sans);font-size:28px;font-weight:600;letter-spacing:-.035em;line-height:1.22}
body.ui-ios .learn-title .accent{color:var(--accent);font-weight:600}
body.ui-ios .learn-sub{font-size:12.5px;color:var(--ink-3);margin-top:4px;letter-spacing:0}
body.ui-ios .learn-bar{margin:10px 0 16px}
body.ui-ios .bar{height:2px;border-radius:999px;background:var(--track);margin-top:10px}
body.ui-ios .bar i{border-radius:999px;background:var(--accent);opacity:.8}
body.ui-ios .sect{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--ink-3);margin:22px 2px 6px}
body.ui-ios .srhead{font-family:var(--sans);font-size:11.5px;font-weight:500;letter-spacing:.02em;color:var(--ink-3);margin:22px 2px 6px}
body.ui-ios .hair{background:var(--hairline);margin:20px 2px}

/* 列表：直接贴在背景上，用细线分隔；不再做整块白卡 */
body.ui-ios .list{
  background:transparent;border-radius:0;padding:0;box-shadow:none;
  border-top:1px solid var(--hairline);
}
body.ui-ios .item{padding:12px 2px;gap:12px;border:0;border-bottom:1px solid var(--hairline);background:transparent}
body.ui-ios .item:last-child{border-bottom:0}
body.ui-ios .item:active{opacity:1;background:var(--hov)}
body.ui-ios .l1{font-size:15.5px;font-weight:500;letter-spacing:-.012em}
body.ui-ios .l2{font-size:12.5px;color:var(--ink-3);margin-top:2px}
body.ui-ios .l3{font-size:11px;color:var(--ink-3);margin-top:3px}
body.ui-ios .cover{border-radius:9px;box-shadow:none;background:var(--field)}
body.ui-ios .cover.big{border-radius:11px}
body.ui-ios .cover.xl{border-radius:13px}
body.ui-ios .tick{width:32px;height:32px;border-radius:50%;background:transparent;color:var(--ink-3)}
body.ui-ios .tick:hover{background:var(--hov);color:var(--ink-2)}
body.ui-ios .tick.on{color:var(--accent);background:transparent}
body.ui-ios .tick.star.on{color:var(--star);background:transparent}
body.ui-ios .tick.del{color:var(--danger);background:transparent}
body.ui-ios .mini{color:var(--ink-3);width:30px;height:30px}
body.ui-ios .grp{
  background:transparent;border:0;border-radius:0;padding:0;margin:0;
  box-shadow:none;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
}
body.ui-ios .grp>summary{padding:12px 2px;font-family:var(--sans);font-size:14px;font-weight:500}
body.ui-ios .grp>summary::after{color:var(--ink-3)}
body.ui-ios .grp .list{border-top:0}
body.ui-ios .albumgrid{gap:16px;margin-top:12px}
body.ui-ios .albumcard .cov{border-radius:14px;box-shadow:none}
body.ui-ios .albumcard .nm{font-family:var(--sans);font-size:13px;font-weight:500;margin-top:8px}
body.ui-ios .albumcard .mt{font-size:11px;color:var(--ink-3)}

/* 设置行 / 账号 / 导入 / 复习条：全部行式，不做单个小卡片 */
body.ui-ios .setrow{
  min-height:50px;padding:12px 2px;margin:0;
  background:transparent;border:0;border-bottom:1px solid var(--hairline);
  border-radius:0;box-shadow:none;
}
body.ui-ios .setrow .k{font-family:var(--sans);font-size:14.5px;font-weight:400}
body.ui-ios .setrow .k small{font-size:11px;color:var(--ink-3);font-family:var(--sans);font-weight:400;margin-top:2px}
body.ui-ios .updrow{
  padding:12px 2px;margin:0;background:transparent;
  border:0;border-bottom:1px solid var(--hairline);border-radius:0;box-shadow:none;
}
body.ui-ios .updrow .k b{font-family:var(--sans);font-size:14.5px;font-weight:500}
body.ui-ios .updrow .k small{font-size:11px;color:var(--ink-3)}
body.ui-ios .accbox{
  background:transparent;border:0;border-bottom:1px solid var(--hairline);
  border-radius:0;padding:14px 2px;margin:0 0 4px;box-shadow:none;
}
body.ui-ios .accbox .l1{font-family:var(--sans);font-size:15px;font-weight:500}
body.ui-ios .accbox .l2{font-size:12px;color:var(--ink-3)}
body.ui-ios .impbox{
  background:transparent;border:0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  border-radius:0;padding:12px 2px;margin:12px 0;box-shadow:none;
}
body.ui-ios .impbox summary{font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink)}
body.ui-ios .impbox summary::before{color:var(--accent)}
body.ui-ios .impbox .sel{background:var(--field)}
body.ui-ios .duebar{
  background:transparent;border:0;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  border-radius:0;padding:12px 2px;margin:10px 0 16px;box-shadow:none;
}
body.ui-ios .duebar .t{font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:0}
body.ui-ios .duebar .n{font-size:12px;color:var(--ink-3)}
body.ui-ios .duebar .go{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--accent)}
body.ui-ios .mine-foot{font-size:12px;color:var(--ink-3)}

/* 按钮：小、薄、玻璃边；主操作也只给淡淡的 accent tint */
body.ui-ios .btn-main{
  height:40px;padding:0 18px;border-radius:20px;
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);
  color:var(--accent);font-family:var(--sans);font-size:14px;font-weight:500;letter-spacing:0;
  box-shadow:inset 0 1px 0 var(--glass-highlight);
}
body.ui-ios.warm .btn-main{color:var(--accent)}
body.ui-ios .btn-main:hover{background:color-mix(in srgb,var(--accent) 16%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}
body.ui-ios .btn-main:active{transform:scale(.985)}
body.ui-ios .btn-ghost{
  height:40px;padding:0 16px;border-radius:20px;background:transparent;
  color:var(--ink-2);font-family:var(--sans);font-size:14px;font-weight:400;
}
body.ui-ios .btn-ghost:hover{color:var(--ink);background:var(--hov)}
body.ui-ios .btn-danger{
  height:30px;padding:0 10px;border-radius:15px;background:transparent;color:var(--danger);font-size:13px;
}
body.ui-ios .toolbtn{
  height:30px;padding:0 11px;border-radius:15px;
  background:transparent;border:1px solid var(--line);
  color:var(--ink-2);font-family:var(--sans);font-size:12.5px;font-weight:400;
}
body.ui-ios .toolbtn:hover{color:var(--ink);background:var(--hov)}
body.ui-ios .toolbtn.on{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
body.ui-ios .btn-primary{
  height:40px;padding:0 18px;border-radius:20px;background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 26%,transparent);color:var(--accent);font-size:14px;
}
body.ui-ios .sel{
  height:34px;padding:0 10px;border-radius:10px;background:var(--field);
  border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:13px;
}
body.ui-ios .code{background:var(--field);border:1px solid var(--line);border-radius:10px;font-size:11.5px}

/* 开关：小一档，绿色只出现在开关本身 */
body.ui-ios .swbtn{
  width:48px;height:28px;padding:0;border-radius:999px;background:var(--surface-2);
  border:1px solid var(--line);color:transparent;font-size:0;position:relative;flex:0 0 auto;
  transition:background-color .2s,border-color .2s;box-shadow:none;
}
body.ui-ios .swbtn::after{
  content:"";position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;
  background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .2s cubic-bezier(.2,.8,.2,1);
}
body.ui-ios .swbtn.on{background:#34c759;border-color:transparent;color:transparent}
body.ui-ios .swbtn.on::after{transform:translateX(20px)}

/* 筛选 chip：透明描边胶囊，选中只染字和边 */
body.ui-ios .chips{gap:7px;margin:10px 0 8px}
body.ui-ios .chip{
  height:28px;padding:0 11px;margin:0;border-radius:999px;
  border:1px solid var(--line);background:transparent;
  color:var(--ink-2);font-family:var(--sans);font-size:12.5px;font-weight:400;
  gap:4px;box-shadow:none;
}
body.ui-ios .chip:hover{background:var(--hov);color:var(--ink)}
body.ui-ios .chip.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent);color:var(--accent);font-weight:500;box-shadow:none}
body.ui-ios .chip.on::after{display:none}
body.ui-ios .chip .sup{color:inherit;opacity:.7}
body.ui-ios .learn-filters{gap:14px;margin:10px 0 16px}
body.ui-ios .learn-filter-row{gap:8px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
body.ui-ios .filter-label{flex:0 0 30px;padding-top:6px;font-family:var(--sans);font-size:10.5px;letter-spacing:.02em;color:var(--ink-3)}
body.ui-ios .learn-filter-row .chips{flex-wrap:nowrap;margin:0}
body.ui-ios .learn-filter-row .chip{margin-right:0;white-space:nowrap}

/* 分段控件：半透明底，选中是一层更薄的玻璃 */
body.ui-ios .segtext{
  display:inline-flex;gap:2px;padding:2px;border-radius:8px;
  background:var(--field);border:1px solid var(--line);
  font-size:12px;flex:0 0 auto;
}
body.ui-ios .segtext button{
  margin:0;padding:0 10px;height:26px;border-radius:6px;background:transparent;
  color:var(--ink-3);font-family:var(--sans);font-size:12px;font-weight:400;
  transition:background-color .16s,color .16s,box-shadow .16s;
}
body.ui-ios .segtext button.on{
  background:var(--glass-strong);color:var(--ink);font-weight:500;
  box-shadow:inset 0 1px 0 var(--glass-highlight),0 1px 3px rgba(0,0,0,.10);
}
body.ui-ios .segtext button.on::after{display:none}

/* 首页：没有主视觉大卡，只有字、细线和一点环境光 */
body.ui-ios .herohead{
  position:relative;overflow:visible;
  padding:26px 2px 14px;margin:0;
  background:transparent;border:0;border-radius:0;box-shadow:none;
}
body.ui-ios .herohead::after{display:none}
body.ui-ios .herohead .ht{font-family:var(--sans);font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1.26;position:relative;z-index:1}
body.ui-ios .herohead .ht .accent{color:var(--accent);font-weight:600}
body.ui-ios .herohead .ht .sep{background:var(--accent);opacity:.55}

body.ui-ios .nowcard{

}
body.ui-ios .nowcard .k{font-family:var(--sans);font-size:10.5px;font-weight:500;letter-spacing:.05em;color:var(--ink-3)}

body.ui-ios .wordstrip button{

}
body.ui-ios .wordstrip button:hover{background:var(--surface-2)}

/* 歌词：行式，不做每句卡片；当前句只加左侧细线和亮度 */
body.ui-ios .lblock{

}
